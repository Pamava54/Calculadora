  }
});

// ---------- 19. Impuesto de renta ----------
add({
  id: 'impuesto-renta', group: 'con', title: 'Impuesto de renta',
  purpose: 'Calcula el impuesto de renta de una sociedad a partir de la utilidad contable, ajustándola a las reglas fiscales, y el saldo a pagar después de anticipos y retenciones.',
  formula: ['Renta líquida gravable = Utilidad contable + Gastos no deducibles − Ingresos no gravados − Compensaciones', 'Impuesto = Renta líquida × Tarifa', 'Saldo a pagar = Impuesto − Anticipos y retenciones'],
  vars: [['Gastos no deducibles', 'Gastos contables que la norma no permite restar'], ['Ingresos no gravados', 'Ingresos que no pagan impuesto'], ['Tarifa', 'Parámetro: 35 % para personas jurídicas']],
  fields: [
    fl('ut', 'Utilidad contable antes de impuestos', 'money', 80000000), fl('nd', 'Gastos no deducibles', 'money', 5000000), fl('ng', 'Ingresos no gravados', 'money', 2000000),
    fl('comp', 'Compensación de pérdidas fiscales', 'money', 0), fl('ant', 'Anticipos y retenciones a favor', 'money', 3000000)
  ],
  compute(v, P) {
    const rl = Math.max(0, v.ut + v.nd - v.ng - v.comp), imp = rl * P.renta, saldo = imp - v.ant, ef = v.ut > 0 ? imp / v.ut : 0;
    const steps = [
      S('Ajustar la utilidad a la base fiscal', `${F.money(v.ut)} + ${F.money(v.nd)} − ${F.money(v.ng)} − ${F.money(v.comp)} = ${F.money(rl)}`, 'La contabilidad y la norma tributaria tienen reglas distintas; se suma lo que no se puede deducir y se resta lo que no está gravado.'),
      S('Aplicar la tarifa', `Impuesto = ${F.money(rl)} × ${F.pct(P.renta, 2)} = ${F.money(imp)}`, 'La tarifa se aplica sobre la renta líquida gravable.'),
      S('Restar lo ya pagado', `Saldo = ${F.money(imp)} − ${F.money(v.ant)} = ${F.money(saldo)}`, 'Las retenciones que le practicaron y los anticipos pagados se descuentan del impuesto.')
    ];
    return {
      res: [R(saldo >= 0 ? 'Saldo a pagar' : 'Saldo a favor', Math.abs(saldo), 'money', 0, true), R('Renta líquida gravable', rl, 'money'), R('Impuesto de renta', imp, 'money'), R('Tarifa efectiva sobre la utilidad', ef, 'pct', 2)], steps,
      asiento: { title: 'Asiento del impuesto', rows: [['540505 Impuesto de renta y complementarios (gasto)', imp, 0], ['1355 Anticipos y retenciones', 0, Math.min(v.ant, imp)], ...(saldo > 0 ? [['2404 Impuesto de renta por pagar', 0, saldo]] : [])] },
      interp: 'La tarifa efectiva suele ser distinta de la nominal porque la base fiscal difiere de la utilidad contable. Esta calculadora no incluye descuentos tributarios ni renta presuntiva.'
    };
  }
});

// ---------- 20. Provisiones ----------
add({
  id: 'provisiones', group: 'con', title: 'Provisiones',
  purpose: 'Calcula valores que se reconocen como gasto hoy aunque se paguen después: cartera de difícil cobro, impuesto de renta y obligaciones laborales.',
  formula: ['Cartera por edades: Σ (Saldo del rango × % de provisión)', 'Cartera general: Cartera × %', 'Impuesto: Utilidad antes de impuestos × Tarifa', 'Laborales: Cesantías 8,33 % + intereses 1 % + prima 8,33 % + vacaciones 4,17 %'],
  vars: [['Provisión', 'Estimación del valor probable que se perderá o pagará'], ['Gasto del periodo', 'Provisión requerida − provisión ya existente']],
  fields: [
    fl('calc', 'Tipo de provisión', 'select', 'edad', { opts: [['edad', 'Cartera por edades de vencimiento'], ['pct', 'Cartera con porcentaje general'], ['renta', 'Impuesto de renta'], ['lab', 'Obligaciones laborales del mes']] }),
    fl('edades', 'Cartera por rango de vencimiento', 'rows', [{ r: 'Al día', s: 30000000, p: 0 }, { r: '1 a 30 días', s: 12000000, p: 1 }, { r: '31 a 90 días', s: 8000000, p: 5 }, { r: '91 a 180 días', s: 4000000, p: 20 }, { r: 'Más de 180 días', s: 2000000, p: 50 }], { show: v => v.calc === 'edad', cols: [{ id: 'r', label: 'Rango', kind: 'text' }, { id: 's', label: 'Saldo de cartera', kind: 'money' }, { id: 'p', label: '% de provisión', kind: 'pct' }], hint: 'Los porcentajes son un ejemplo: la empresa define su política.' }),
    fl('cartera', 'Cartera total', 'money', 56000000, { show: v => v.calc === 'pct' }), fl('pp', 'Porcentaje de provisión (%)', 'pct', 3, { show: v => v.calc === 'pct' }),
    fl('previa', 'Provisión ya registrada', 'money', 0, { show: v => v.calc === 'edad' || v.calc === 'pct' }),
    fl('ut', 'Utilidad antes de impuestos del periodo', 'money', 10000000, { show: v => v.calc === 'renta' }),
    fl('salario', 'Salario mensual', 'money', 2500000, { show: v => v.calc === 'lab' })
  ],
  compute(v, P) {
    const steps = [], res = []; let asiento;
    if (v.calc === 'edad' || v.calc === 'pct') {
      let req, rows = [];
      if (v.calc === 'edad') {
        rows = v.edades.map(e => [e.r, e.s, e.p, e.s * e.p]); req = rows.reduce((s, r) => s + r[3], 0);
        steps.push(S('Multiplicar cada rango por su porcentaje', 'Provisión del rango = Saldo × % (ver tabla)', 'Cuanto más vencida está una factura, menos probable es cobrarla, por eso el porcentaje es mayor.'));
        steps.push(S('Sumar los rangos', `Provisión requerida = ${F.money(req)}`, 'Es el valor total que debe tener la cuenta de provisión de cartera.'));
      } else {
        req = v.cartera * v.pp;
        steps.push(S('Aplicar el porcentaje a la cartera', `${F.money(v.cartera)} × ${F.pct(v.pp, 2)} = ${F.money(req)}`, 'Método simple: un porcentaje único para toda la cartera.'));
      }
      const gasto = req - v.previa;
      steps.push(S('Descontar lo ya provisionado', `Gasto del periodo = ${F.money(req)} − ${F.money(v.previa)} = ${F.money(gasto)}`, 'Solo se registra la diferencia, para no duplicar lo reconocido en periodos anteriores.'));
      res.push(R('Gasto por provisión del periodo', gasto, 'money', 0, true), R('Provisión requerida', req, 'money'));
      asiento = { title: 'Asiento de la provisión', rows: gasto >= 0 ? [['5199 Provisiones (gasto por deudores)', gasto, 0], ['1399 Provisión de cartera', 0, gasto]] : [['1399 Provisión de cartera', -gasto, 0], ['4295 Recuperación de provisiones', 0, -gasto]] };
      return { res, steps, asiento, table: rows.length ? { title: 'Provisión por rango', h: ['Rango', 'Saldo', '% provisión', 'Provisión'], k: ['t', 'm', 'f', 'm'], rows } : null, interp: 'La provisión no elimina la deuda: la cartera sigue registrada, pero se reconoce el riesgo de no cobrarla. Se castiga la cartera cuando se agotan los medios de cobro.' };
    }
    if (v.calc === 'renta') {
      const p = Math.max(0, v.ut * P.renta);
      steps.push(S('Aplicar la tarifa a la utilidad', `${F.money(v.ut)} × ${F.pct(P.renta, 2)} = ${F.money(p)}`, 'Se reconoce mes a mes el impuesto que se pagará al declarar, para que el gasto quede en el periodo en que se generó la utilidad.'));
      res.push(R('Provisión de impuesto de renta', p, 'money', 0, true));
      asiento = { title: 'Asiento de la provisión', rows: [['540505 Impuesto de renta y complementarios (gasto)', p, 0], ['2404 Impuesto de renta por pagar', 0, p]] };
      return { res, steps, asiento, interp: 'Es una estimación mensual. Al cierre del año se compara con el impuesto calculado en la herramienta de impuesto de renta y se ajusta la diferencia.' };
    }
    const aux = v.salario <= 2 * P.smmlv ? P.aux : 0, base = v.salario + aux, ces = base / 12, ints = ces * 0.12, prima = base / 12, vac = v.salario * 15 / 360, tot = ces + ints + prima + vac;
    steps.push(S('Definir la base', `Base = ${F.money(v.salario)} + auxilio ${F.money(aux)} = ${F.money(base)}`, 'Cesantías y prima incluyen el auxilio de transporte.'));
    steps.push(S('Provisionar cesantías, intereses y prima', `Cesantías ${F.money(ces)}; intereses ${F.money(ints)}; prima ${F.money(prima)}`, 'Cada mes se reconoce 1/12 de cesantías y de prima, y el 12 % anual de intereses sobre las cesantías.'));
    steps.push(S('Provisionar vacaciones', `${F.money(v.salario)} × 15 ÷ 360 = ${F.money(vac)}`, 'Se causan 15 días de salario por cada 360 días trabajados.'));
    res.push(R('Total provisión mensual', tot, 'money', 0, true), R('Cesantías', ces, 'money'), R('Intereses a las cesantías', ints, 'money'), R('Prima de servicios', prima, 'money'), R('Vacaciones', vac, 'money'));
    asiento = { title: 'Asiento mensual', rows: [['5105 Gastos de personal (prestaciones)', tot, 0], ['2510 Cesantías consolidadas', 0, ces], ['2515 Intereses sobre cesantías', 0, ints], ['2520 Prima de servicios', 0, prima], ['2525 Vacaciones consolidadas', 0, vac]] };
    return { res, steps, asiento, interp: 'Provisionar cada mes evita que el gasto de las prestaciones se concentre en los meses en que se pagan.' };
  }
});

// ---------- 21. Conciliación bancaria ----------
const CONC_TIPOS = [
  ['DT', 'Depósito en tránsito (suma al banco)'],
  ['CC', 'Cheque girado y no cobrado (resta al banco)'],
  ['EB+', 'Error del banco que suma al extracto'],
  ['EB-', 'Error del banco que resta al extracto'],
  ['NC', 'Nota crédito no contabilizada (suma a libros)'],
  ['ND', 'Nota débito no contabilizada: comisión, GMF, cheque devuelto (resta a libros)'],
  ['EL+', 'Error en libros que suma al saldo de libros'],
  ['EL-', 'Error en libros que resta al saldo de libros']
];
add({
  id: 'conciliacion-bancaria', group: 'con', title: 'Conciliación bancaria',
  purpose: 'Compara el saldo del extracto del banco con el saldo de la cuenta Bancos en los libros de la empresa. Usted lista cada partida conciliatoria y la calculadora ajusta ambos saldos, verifica que cuadren y genera los asientos de ajuste.',
  formula: ['Saldo conciliado según banco = Extracto + Depósitos en tránsito − Cheques sin cobrar ± Errores del banco', 'Saldo conciliado según libros = Libros + Notas crédito − Notas débito ± Errores de libros', 'La conciliación cuadra cuando los dos saldos conciliados son iguales'],
  vars: [['Depósito en tránsito', 'Consignación que la empresa ya hizo y el banco aún no registra'], ['Cheque en circulación', 'Cheque girado que el beneficiario aún no cobra'], ['Nota crédito', 'Ingreso del banco que la empresa no ha contabilizado (intereses, consignación directa)'], ['Nota débito', 'Cargo del banco no contabilizado (comisiones, GMF 4×1.000, cheque devuelto)']],
  fields: [
    fl('sb', 'Saldo según el extracto bancario', 'money', 15200000),
    fl('sl', 'Saldo según libros (cuenta Bancos)', 'money', 15860000),
    fl('p', 'Partidas conciliatorias', 'rows', [
      { c: 'Consignación del 30 de mes', t: 'DT', v: 2000000 },
      { c: 'Cheque 1048 a proveedor', t: 'CC', v: 850000 },
      { c: 'Cheque 1051 a proveedor', t: 'CC', v: 500000 },
      { c: 'Intereses de la cuenta', t: 'NC', v: 120000 },
      { c: 'Comisión por manejo', t: 'ND', v: 50000 },
      { c: 'GMF (4 por mil)', t: 'ND', v: 80000 }
    ], { cols: [{ id: 'c', label: 'Concepto', kind: 'text' }, { id: 't', label: 'Tipo de partida', kind: 'select', opts: CONC_TIPOS }, { id: 'v', label: 'Valor', kind: 'money' }], hint: 'Escriba el valor siempre en positivo; el tipo de partida define si suma o resta. Las partidas del banco ajustan el extracto y las de libros ajustan la cuenta Bancos.' })
  ],
  compute(v) {
    const L = v.p.filter(x => x.v || String(x.c).trim());
    const sum = t => L.filter(x => x.t === t).reduce((s, x) => s + x.v, 0);
    const dt = sum('DT'), cc = sum('CC'), ebp = sum('EB+'), ebn = sum('EB-'), nc = sum('NC'), nd = sum('ND'), elp = sum('EL+'), eln = sum('EL-');
    const cb = v.sb + dt - cc + ebp - ebn, cl = v.sl + nc - nd + elp - eln, dif = cb - cl, ok = Math.abs(dif) < 0.5;
    const of = t => L.filter(x => x.t === t);
    const rows = [['SEGÚN EL EXTRACTO BANCARIO', null], ['Saldo del extracto', v.sb]];
    of('DT').forEach(x => rows.push(['(+) Depósito en tránsito: ' + (x.c || 'sin concepto'), x.v]));
    of('CC').forEach(x => rows.push(['(−) Cheque sin cobrar: ' + (x.c || 'sin concepto'), -x.v]));
    of('EB+').forEach(x => rows.push(['(+) Error del banco: ' + (x.c || 'sin concepto'), x.v]));
    of('EB-').forEach(x => rows.push(['(−) Error del banco: ' + (x.c || 'sin concepto'), -x.v]));
    rows.push(['SALDO CONCILIADO SEGÚN BANCO', cb], ['SEGÚN LOS LIBROS', null], ['Saldo de libros (cuenta Bancos)', v.sl]);
    of('NC').forEach(x => rows.push(['(+) Nota crédito: ' + (x.c || 'sin concepto'), x.v]));
    of('ND').forEach(x => rows.push(['(−) Nota débito: ' + (x.c || 'sin concepto'), -x.v]));
    of('EL+').forEach(x => rows.push(['(+) Error en libros: ' + (x.c || 'sin concepto'), x.v]));
    of('EL-').forEach(x => rows.push(['(−) Error en libros: ' + (x.c || 'sin concepto'), -x.v]));
    rows.push(['SALDO CONCILIADO SEGÚN LIBROS', cl], ['DIFERENCIA ENTRE LOS DOS SALDOS', dif]);
    const as = [];
    of('NC').forEach(x => { as.push(['1110 Bancos', x.v, 0], ['4210 Ingresos financieros: ' + (x.c || 'nota crédito'), 0, x.v]); });
    of('ND').forEach(x => { as.push(['5305 Gastos financieros: ' + (x.c || 'nota débito'), x.v, 0], ['1110 Bancos', 0, x.v]); });
    of('EL+').forEach(x => { as.push(['1110 Bancos', x.v, 0], ['Cuenta por corregir: ' + (x.c || 'error en libros'), 0, x.v]); });
    of('EL-').forEach(x => { as.push(['Cuenta por corregir: ' + (x.c || 'error en libros'), x.v, 0], ['1110 Bancos', 0, x.v]); });
    const nAj = of('NC').length + of('ND').length + of('EL+').length + of('EL-').length;
    const steps = [
      S('Ajustar el saldo del extracto', `${F.money(v.sb)} + ${F.money(dt)} − ${F.money(cc)} + ${F.money(ebp)} − ${F.money(ebn)} = ${F.money(cb)}`, 'Al extracto se le suma lo que la empresa ya consignó y el banco aún no registra, y se le resta lo que giró en cheques que todavía no se cobran. Los errores del banco se corrigen aquí.'),
      S('Ajustar el saldo de libros', `${F.money(v.sl)} + ${F.money(nc)} − ${F.money(nd)} + ${F.money(elp)} − ${F.money(eln)} = ${F.money(cl)}`, 'A los libros se les suman los ingresos y se les restan los cargos que el banco hizo y la empresa no había contabilizado. Los errores de la empresa se corrigen aquí.'),
      S('Comparar los dos saldos conciliados', `Diferencia = ${F.money(cb)} − ${F.money(cl)} = ${F.money(dif)}`, 'Si la diferencia es cero, la conciliación está completa. Si no, falta una partida o hay un valor mal digitado.'),
      S('Identificar qué partidas requieren asiento', nAj ? `${nAj} partida(s) de libros: notas crédito, notas débito y errores` : 'Ninguna partida de libros', 'Las partidas del lado del banco (depósitos en tránsito, cheques sin cobrar) no se contabilizan: se resuelven solas cuando el banco las registre. Las del lado de libros sí necesitan asiento de ajuste.')
    ];
    return {
      res: [R('Saldo conciliado', cb, 'money', 0, true), R('Saldo conciliado en libros', cl, 'money'), R('Diferencia', dif, 'money'), R('Estado de la conciliación', ok ? 'Cuadra' : 'No cuadra', 'text'), R('Partidas que requieren asiento', nAj, 'num', 0)], steps,
      table: { title: 'Conciliación bancaria', h: ['Concepto', 'Valor'], k: ['t', 'm'], rows },
      asiento: as.length ? { title: 'Asientos de ajuste en libros', rows: as } : null,
      interp: ok ? 'La conciliación cuadra. Después de registrar los asientos de ajuste, el saldo de la cuenta Bancos en libros debe quedar igual al saldo conciliado.' : `La conciliación no cuadra: hay una diferencia de ${F.money(dif)}. Revise que no falte ninguna partida, que los valores estén bien digitados y que el tipo de cada partida sea el correcto.`
    };
  }
});

// ---------- 22. Balance general ----------
add({
  id: 'balance-general', group: 'con', title: 'Balance general',
  purpose: 'Muestra lo que la empresa tiene (activos), lo que debe (pasivos) y lo que pertenece a los socios (patrimonio) en una fecha, y verifica que se cumpla la ecuación contable.',
  formula: ['Activo = Pasivo + Patrimonio', 'Activo total = Activo corriente + Activo no corriente', 'Pasivo total = Pasivo corriente + Pasivo no corriente'],
  vars: [['Corriente', 'Se convierte en efectivo o se paga en menos de un año'], ['No corriente', 'Plazo mayor a un año'], ['Patrimonio', 'Aportes de los socios más utilidades']],
  fields: [
    fl('efe', 'Efectivo y bancos', 'money', 15000000), fl('cxc', 'Cuentas por cobrar', 'money', 18000000), fl('inv', 'Inventarios', 'money', 20000000), fl('oac', 'Otros activos corrientes', 'money', 2000000),
    fl('ppe', 'Propiedad, planta y equipo (neto)', 'money', 70000000), fl('int', 'Intangibles', 'money', 10000000), fl('oanc', 'Otros activos no corrientes', 'money', 0),
    fl('prov', 'Proveedores', 'money', 20000000), fl('lab', 'Obligaciones laborales', 'money', 5000000), fl('imp', 'Impuestos por pagar', 'money', 4000000), fl('ofc', 'Obligaciones financieras a corto plazo', 'money', 6000000),
    fl('ofl', 'Obligaciones financieras a largo plazo', 'money', 30000000),
    fl('cap', 'Capital social', 'money', 40000000), fl('res', 'Reservas', 'money', 5000000), fl('uac', 'Utilidades acumuladas', 'money', 8000000), fl('uej', 'Utilidad del ejercicio', 'money', 17000000)
  ],
  compute(v) {
    const ac = v.efe + v.cxc + v.inv + v.oac, anc = v.ppe + v.int + v.oanc, at = ac + anc, pc = v.prov + v.lab + v.imp + v.ofc, pnc = v.ofl, pt = pc + pnc, pat = v.cap + v.res + v.uac + v.uej, dif = at - (pt + pat);

      ['PASIVO', null, null], L('Proveedores', v.prov), L('Obligaciones laborales', v.lab), L('Impuestos por pagar', v.imp), L('Obligaciones financieras a corto plazo', v.ofc), L('Total pasivo corriente', pc), L('Obligaciones financieras a largo plazo', v.ofl), L('Total pasivo no corriente', pnc), L('TOTAL PASIVO', pt),
      ['PATRIMONIO', null, null], L('Capital social', v.cap), L('Reservas', v.res), L('Utilidades acumuladas', v.uac), L('Utilidad del ejercicio', v.uej), L('TOTAL PATRIMONIO', pat), L('TOTAL PASIVO + PATRIMONIO', pt + pat)];
    const steps = [
      S('Sumar los activos', `Corriente ${F.money(ac)} + no corriente ${F.money(anc)} = ${F.money(at)}`, 'Son los recursos que controla la empresa.'),
      S('Sumar los pasivos', `Corriente ${F.money(pc)} + no corriente ${F.money(pnc)} = ${F.money(pt)}`, 'Son las obligaciones con terceros.'),
      S('Sumar el patrimonio', `${F.money(v.cap)} + ${F.money(v.res)} + ${F.money(v.uac)} + ${F.money(v.uej)} = ${F.money(pat)}`, 'Es lo que queda para los socios después de pagar todas las deudas.'),
      S('Verificar la ecuación contable', `Activo − (Pasivo + Patrimonio) = ${F.money(at)} − ${F.money(pt + pat)} = ${F.money(dif)}`, 'Todo lo que la empresa tiene fue financiado por deuda o por aportes de los socios, por eso ambos lados deben ser iguales.')
    ];
    return { res: [R('Total activo', at, 'money', 0, true), R('Total pasivo', pt, 'money'), R('Patrimonio', pat, 'money'), R('Ecuación contable', Math.abs(dif) < 0.5 ? 'Cuadra' : 'No cuadra: diferencia ' + F.money(dif), 'text')], steps, table: { title: 'Balance general', h: ['Cuenta', 'Valor', '% del activo'], k: ['t', 'm', 'p2'], rows }, interp: Math.abs(dif) < 0.5 ? 'El balance cuadra. Un balance que no cuadra indica un error de digitación o una cuenta omitida.' : 'El balance no cuadra. Revise cuentas omitidas o valores digitados con error.' };
  }
});

// ---------- 23. Estado de resultados ----------
add({
  id: 'estado-resultados', group: 'con', title: 'Estado de resultados',
  purpose: 'Muestra cuánto vendió la empresa, cuánto gastó y cuánta utilidad o pérdida obtuvo en un periodo.',
  formula: ['Utilidad bruta = Ingresos netos − Costo de ventas', 'Utilidad operacional = Utilidad bruta − Gastos de administración y ventas', 'Utilidad antes de impuestos = Operacional + Otros ingresos − Gastos financieros', 'Utilidad neta = Antes de impuestos − Impuesto de renta'],
  vars: [['Ingresos netos', 'Ventas menos devoluciones y descuentos'], ['Costo de ventas', 'Costo de lo vendido']],
  fields: [
    fl('ven', 'Ventas brutas', 'money', 240000000), fl('dev', 'Devoluciones y descuentos', 'money', 4000000), fl('cv', 'Costo de ventas', 'money', 150000000),

  ],

    const L = (n, x) => [n, x, ing ? x / ing : 0];
    const rows = [L('Ventas brutas', v.ven), L('(−) Devoluciones y descuentos', v.dev), L('INGRESOS NETOS', ing), L('(−) Costo de ventas', v.cv), L('UTILIDAD BRUTA', ub), L('(−) Gastos de administración', v.ga), L('(−) Gastos de ventas', v.gv), L('UTILIDAD OPERACIONAL', uo), L('(+) Otros ingresos', v.oi), L('(−) Gastos financieros', v.gf), L('UTILIDAD ANTES DE IMPUESTOS', uai), L('(−) Impuesto de renta (' + F.pct(P.renta, 0) + ')', imp), L('UTILIDAD NETA', un)];
    const steps = [
      S('Calcular los ingresos netos', `${F.money(v.ven)} − ${F.money(v.dev)} = ${F.money(ing)}`, 'Las devoluciones y descuentos reducen lo realmente vendido.'),
      S('Calcular la utilidad bruta', `${F.money(ing)} − ${F.money(v.cv)} = ${F.money(ub)}`, 'Muestra cuánto deja la venta después del costo de los productos.'),
      S('Calcular la utilidad operacional', `${F.money(ub)} − ${F.money(v.ga)} − ${F.money(v.gv)} = ${F.money(uo)}`, 'Mide el resultado de la actividad principal, antes de ingresos y gastos financieros.'),
      S('Calcular la utilidad antes de impuestos', `${F.money(uo)} + ${F.money(v.oi)} − ${F.money(v.gf)} = ${F.money(uai)}`, 'Incluye lo que no hace parte de la operación.'),
      S('Restar el impuesto', `${F.money(uai)} × ${F.pct(P.renta, 0)} = ${F.money(imp)};  utilidad neta = ${F.money(un)}`, 'Es la utilidad que realmente queda para los socios.')
    ];
    return { res: [R('Utilidad neta', un, 'money', 0, true), R('Utilidad bruta', ub, 'money'), R('Utilidad operacional', uo, 'money'), R('Margen neto', ing ? un / ing : 0, 'pct', 2)], steps, table: { title: 'Estado de resultados', h: ['Concepto', 'Valor', '% de ingresos'], k: ['t', 'm', 'p2'], rows }, interp: `Por cada $100 de ingresos netos, la empresa deja $${F.num(ing ? un / ing * 100 : 0, 2)} de utilidad neta. Compare los márgenes de cada nivel para ver dónde se pierde más.` };
  }
});

// ---------- 24. Flujo de efectivo ----------
add({
  id: 'flujo-efectivo', group: 'con', title: 'Flujo de efectivo',
  purpose: 'Explica de dónde vino el dinero y en qué se usó durante el periodo, con el método indirecto: parte de la utilidad y la ajusta por lo que no fue movimiento de efectivo.',
  formula: ['Operación = Utilidad neta + Depreciación y amortización − Aumento de cartera − Aumento de inventarios + Aumento de proveedores', 'Variación neta = Operación + Inversión + Financiación', 'Efectivo final = Efectivo inicial + Variación neta'],
  vars: [['Operación', 'Dinero generado por la actividad normal'], ['Inversión', 'Compra y venta de activos fijos'], ['Financiación', 'Préstamos, aportes y dividendos']],
  fields: [
    fl('un', 'Utilidad neta', 'money', 18000000), fl('dep', 'Depreciación y amortización del periodo', 'money', 7000000),
    fl('dcxc', 'Aumento (+) o disminución (−) de cuentas por cobrar', 'money', 4000000), fl('dinv', 'Aumento (+) o disminución (−) de inventarios', 'money', 3000000), fl('dprov', 'Aumento (+) o disminución (−) de proveedores', 'money', 5000000), fl('dop', 'Aumento (+) o disminución (−) de otros pasivos operativos', 'money', 1000000),
    fl('cpra', 'Compra de activos fijos', 'money', 12000000), fl('vta', 'Venta de activos fijos', 'money', 2000000),
    fl('pre', 'Nuevos préstamos recibidos', 'money', 10000000), fl('pag', 'Pago de préstamos', 'money', 6000000), fl('apo', 'Aportes de socios', 'money', 0), fl('div', 'Dividendos pagados', 'money', 5000000),
    fl('ini', 'Efectivo al inicio del periodo', 'money', 10000000)
  ],
  compute(v) {
    const op = v.un + v.dep - v.dcxc - v.dinv + v.dprov + v.dop, inv = -v.cpra + v.vta, fin = v.pre - v.pag + v.apo - v.div, net = op + inv + fin, fin_ = v.ini + net;
    const rows = [['ACTIVIDADES DE OPERACIÓN', null], ['Utilidad neta', v.un], ['(+) Depreciación y amortización', v.dep], ['(−) Aumento de cuentas por cobrar', -v.dcxc], ['(−) Aumento de inventarios', -v.dinv], ['(+) Aumento de proveedores', v.dprov], ['(+) Aumento de otros pasivos operativos', v.dop], ['Total flujo de operación', op],
      ['ACTIVIDADES DE INVERSIÓN', null], ['(−) Compra de activos fijos', -v.cpra], ['(+) Venta de activos fijos', v.vta], ['Total flujo de inversión', inv],
      ['ACTIVIDADES DE FINANCIACIÓN', null], ['(+) Nuevos préstamos', v.pre], ['(−) Pago de préstamos', -v.pag], ['(+) Aportes de socios', v.apo], ['(−) Dividendos pagados', -v.div], ['Total flujo de financiación', fin],
      ['VARIACIÓN NETA DEL EFECTIVO', net], ['Efectivo al inicio', v.ini], ['EFECTIVO AL FINAL', fin_]];
    const steps = [
      S('Partir de la utilidad y sumar lo que no fue efectivo', `${F.money(v.un)} + ${F.money(v.dep)} = ${F.money(v.un + v.dep)}`, 'La depreciación redujo la utilidad pero no sacó dinero de la caja, por eso se suma de nuevo.'),
      S('Ajustar por cambios en cuentas operativas', `− cartera ${F.money(v.dcxc)} − inventarios ${F.money(v.dinv)} + proveedores ${F.money(v.dprov)} + otros ${F.money(v.dop)}`, 'Si la cartera o el inventario suben, se usó efectivo; si proveedores sube, se financió con crédito.'),
      S('Calcular el flujo de operación', `Operación = ${F.money(op)}`, 'Es el dinero generado por el negocio en sí.'),
      S('Calcular inversión y financiación', `Inversión = ${F.money(inv)};  financiación = ${F.money(fin)}`, 'Comprar activos y pagar deudas usa efectivo; vender activos y recibir préstamos lo aportan.'),
      S('Obtener el efectivo final', `${F.money(v.ini)} + ${F.money(net)} = ${F.money(fin_)}`, 'Debe coincidir con el efectivo del balance general.')
    ];
    return { res: [R('Efectivo al final', fin_, 'money', 0, true), R('Flujo de operación', op, 'money'), R('Flujo de inversión', inv, 'money'), R('Flujo de financiación', fin, 'money'), R('Variación neta', net, 'money')], steps, table: { title: 'Estado de flujo de efectivo (método indirecto)', h: ['Concepto', 'Valor'], k: ['t', 'm'], rows }, interp: 'Una empresa puede tener utilidad y quedarse sin efectivo si invierte demasiado en cartera e inventarios. Un flujo de operación positivo y sostenido es señal de salud.' };
  }
});

// ---------- 25. Cierre contable ----------
const TIPOS = [['A', 'Activo'], ['P', 'Pasivo'], ['PT', 'Patrimonio'], ['I', 'Ingreso'], ['C', 'Costo'], ['G', 'Gasto']];
add({
  id: 'cierre-contable', group: 'con', title: 'Cierre contable',
  purpose: 'Toma el balance de prueba, aplica los ajustes de fin de periodo, verifica que débitos y créditos cuadren y calcula la utilidad del ejercicio con los asientos de cierre.',
  formula: ['Saldo ajustado = Saldo inicial ± Ajustes', 'Σ Débitos = Σ Créditos', 'Utilidad antes de impuestos = Ingresos − Costos − Gastos', 'Utilidad neta = Utilidad antes de impuestos − Impuesto de renta'],
  vars: [['Balance de prueba', 'Lista de saldos de todas las cuentas'], ['Ajustes', 'Asientos de fin de periodo: depreciación, provisiones, amortizaciones'], ['Asientos de cierre', 'Llevan los saldos de ingresos, costos y gastos a la utilidad del ejercicio']],
  fields: [
    fl('bp', 'Balance de prueba (antes de ajustes)', 'rows', [
      { c: 'Caja', t: 'A', d: 5000000, h: 0 }, { c: 'Bancos', t: 'A', d: 12000000, h: 0 }, { c: 'Clientes', t: 'A', d: 8000000, h: 0 }, { c: 'Inventario de mercancías', t: 'A', d: 15000000, h: 0 }, { c: 'Equipo de cómputo', t: 'A', d: 6000000, h: 0 },
      { c: 'Proveedores', t: 'P', d: 0, h: 9000000 }, { c: 'Obligaciones financieras', t: 'P', d: 0, h: 10000000 }, { c: 'Capital social', t: 'PT', d: 0, h: 20000000 },
      { c: 'Ventas', t: 'I', d: 0, h: 45000000 }, { c: 'Costo de ventas', t: 'C', d: 28000000, h: 0 }, { c: 'Gastos de personal', t: 'G', d: 6000000, h: 0 }, { c: 'Arrendamientos', t: 'G', d: 2400000, h: 0 }, { c: 'Servicios públicos', t: 'G', d: 1200000, h: 0 }, { c: 'Gastos financieros', t: 'G', d: 400000, h: 0 }
    ], { cols: [{ id: 'c', label: 'Cuenta', kind: 'text' }, { id: 't', label: 'Tipo', kind: 'select', opts: TIPOS }, { id: 'd', label: 'Débito', kind: 'money' }, { id: 'h', label: 'Crédito', kind: 'money' }] }),
    fl('aj', 'Ajustes de fin de periodo', 'rows', [
      { c: 'Gasto por depreciación', t: 'G', d: 500000, h: 0 }, { c: 'Depreciación acumulada', t: 'A', d: 0, h: 500000 }, { c: 'Gasto por provisión de cartera', t: 'G', d: 400000, h: 0 }, { c: 'Provisión de cartera', t: 'A', d: 0, h: 400000 }
    ], { cols: [{ id: 'c', label: 'Cuenta', kind: 'text' }, { id: 't', label: 'Tipo', kind: 'select', opts: TIPOS }, { id: 'd', label: 'Débito', kind: 'money' }, { id: 'h', label: 'Crédito', kind: 'money' }], hint: 'Si usa el mismo nombre de cuenta que en el balance de prueba, se suman juntos.' })
  ],
  compute(v, P) {
    const map = new Map();
    const put = (list, i) => list.forEach(r => { const key = String(r.c).trim().toLowerCase(); if (!key) return; if (!map.has(key)) map.set(key, { c: String(r.c).trim(), t: r.t, d0: 0, h0: 0, da: 0, ha: 0 }); const o = map.get(key); if (i === 0) { o.d0 += r.d; o.h0 += r.h; } else { o.da += r.d; o.ha += r.h; } });
    put(v.bp, 0); put(v.aj, 1);
    if (!map.size) return { error: 'Agregue cuentas al balance de prueba.' };
    const accs = [...map.values()].map(o => { const net = o.d0 + o.da - o.h0 - o.ha; return Object.assign(o, { sd: net > 0 ? net : 0, sh: net < 0 ? -net : 0, net }); });
    const sum = k => accs.reduce((s, o) => s + o[k], 0), tn = (t) => accs.filter(o => o.t === t);
    const D0 = sum('d0'), H0 = sum('h0'), DA = sum('da'), HA = sum('ha'), SD = sum('sd'), SH = sum('sh');
    const ing = tn('I').reduce((s, o) => s - o.net, 0), cos = tn('C').reduce((s, o) => s + o.net, 0), gas = tn('G').reduce((s, o) => s + o.net, 0), uai = ing - cos - gas, imp = Math.max(0, uai) * P.renta, un = uai - imp;
    const rows = accs.map(o => [o.c, (TIPOS.find(x => x[0] === o.t) || [0, o.t])[1], o.d0, o.h0, o.da, o.ha, o.sd, o.sh]); rows.push(['Totales', '', D0, H0, DA, HA, SD, SH]);
    const cuadra = Math.abs(D0 - H0) < 0.5 && Math.abs(DA - HA) < 0.5 && Math.abs(SD - SH) < 0.5;
    const as = [];
    tn('I').forEach(o => { if (Math.abs(o.net) > 0) as.push([o.c, -o.net, 0]); }); as.push(['5905 Ganancias y pérdidas', 0, ing]);
    as.push(['5905 Ganancias y pérdidas', cos + gas, 0]); [...tn('C'), ...tn('G')].forEach(o => { if (Math.abs(o.net) > 0) as.push([o.c, 0, o.net]); });
    if (imp > 0) { as.push(['5905 Ganancias y pérdidas', imp, 0], ['2404 Impuesto de renta por pagar', 0, imp]); }
    as.push(['5905 Ganancias y pérdidas', Math.max(un, 0), Math.max(-un, 0)], [un >= 0 ? '3605 Utilidad del ejercicio' : '3610 Pérdida del ejercicio', Math.max(-un, 0), Math.max(un, 0)]);
    const steps = [
      S('Sumar el balance de prueba inicial', `Débitos ${F.money(D0)} / Créditos ${F.money(H0)}`, 'La contabilidad por partida doble exige que lo debitado sea igual a lo acreditado.'),
      S('Aplicar los ajustes', `Ajustes: débitos ${F.money(DA)} / créditos ${F.money(HA)}`, 'Los ajustes reconocen hechos del periodo que aún no estaban registrados, como la depreciación y las provisiones.'),
      S('Calcular los saldos ajustados', `Débitos ${F.money(SD)} / Créditos ${F.money(SH)}  →  ${cuadra ? 'cuadra' : 'NO cuadra'}`, 'Cada cuenta queda con un solo saldo, deudor o acreedor.'),
      S('Calcular la utilidad antes de impuestos', `Ingresos ${F.money(ing)} − costos ${F.money(cos)} − gastos ${F.money(gas)} = ${F.money(uai)}`, 'Solo las cuentas de resultado (ingresos, costos y gastos) entran en el cálculo.'),
      S('Restar el impuesto y cerrar', `Impuesto ${F.money(imp)};  utilidad neta = ${F.money(un)}`, 'Los saldos de las cuentas de resultado se llevan a Ganancias y pérdidas y de allí a patrimonio, para empezar el siguiente periodo en cero.')
    ];
    return { res: [R(un >= 0 ? 'Utilidad neta del ejercicio' : 'Pérdida neta del ejercicio', Math.abs(un), 'money', 0, true), R('Utilidad antes de impuestos', uai, 'money'), R('Impuesto de renta', imp, 'money'), R('Balance ajustado', cuadra ? 'Cuadra' : 'No cuadra', 'text')], steps, tables: [{ title: 'Hoja de trabajo: balance de prueba y ajustes', h: ['Cuenta', 'Tipo', 'Inicial débito', 'Inicial crédito', 'Ajuste débito', 'Ajuste crédito', 'Ajustado débito', 'Ajustado crédito'], k: ['t', 't', 'm', 'm', 'm', 'm', 'm', 'm'], rows }], asiento: { title: 'Asientos de cierre', rows: as }, interp: cuadra ? 'Los saldos cuadran. Después de los asientos de cierre, las cuentas de resultado quedan en cero y la utilidad pasa al patrimonio.' : 'El balance no cuadra: revise los débitos y créditos digitados antes de cerrar el periodo.' };
  }
});

// ---------- 26. Diferencia en cambio e inflación ----------
add({
  id: 'cambio-inflacion', group: 'con', title: 'Diferencia en cambio e inflación',
  purpose: 'Calcula la diferencia en cambio de partidas en moneda extranjera, actualiza valores con la inflación (IPC) y obtiene la tasa de interés real.',
  formula: ['Diferencia en cambio = Valor en moneda extranjera × (TRM final − TRM inicial)', 'Valor ajustado = Valor × (1 + Inflación)', 'Tasa real = (1 + Tasa nominal) ÷ (1 + Inflación) − 1'],
  vars: [['TRM', 'Tasa representativa del mercado: pesos por dólar'], ['IPC', 'Índice de precios al consumidor']],
  fields: [
    fl('calc', '¿Qué quiere calcular?', 'select', 'cambio', { opts: [['cambio', 'Diferencia en cambio'], ['ipc', 'Ajuste de un valor por inflación'], ['real', 'Tasa de interés real']] }),
    fl('nat', 'La partida es', 'select', 'A', { opts: [['A', 'Un activo (cuenta por cobrar, dólares en caja)'], ['P', 'Un pasivo (deuda o proveedor en dólares)']], show: v => v.calc === 'cambio' }),
    fl('me', 'Valor en moneda extranjera (USD)', 'num', 5000, { show: v => v.calc === 'cambio' }),
    fl('t0', 'TRM al registrar la operación', 'num', 4000, { show: v => v.calc === 'cambio' }), fl('t1', 'TRM al cierre', 'num', 4200, { show: v => v.calc === 'cambio' }),
    fl('valor', 'Valor a actualizar', 'money', 1500000, { show: v => v.calc === 'ipc' }),
    fl('inf', 'Inflación del periodo (%)', 'pct', 5.2, { show: v => v.calc === 'ipc' || v.calc === 'real' }),
    fl('nom', 'Tasa de interés nominal (%)', 'pct', 12, { show: v => v.calc === 'real' })
  ],
  compute(v) {
    const steps = [], res = []; let asiento = null, interp;
    if (v.calc === 'cambio') {
      const d = v.me * (v.t1 - v.t0), ini = v.me * v.t0, fin = v.me * v.t1, ganancia = v.nat === 'A' ? d >= 0 : d <= 0, m = Math.abs(d);
      steps.push(S('Valorar la partida al inicio', `${F.num(v.me, 2)} USD × ${F.money(v.t0, 2)} = ${F.money(ini)}`, 'Es el valor en pesos con el que se registró la operación.'));
      steps.push(S('Valorar la partida al cierre', `${F.num(v.me, 2)} USD × ${F.money(v.t1, 2)} = ${F.money(fin)}`, 'Al cierre las partidas en moneda extranjera se ajustan con la TRM de ese día.'));
      steps.push(S('Calcular la diferencia', `${F.money(fin)} − ${F.money(ini)} = ${F.money(d)}`, v.nat === 'A' ? 'Si el dólar sube, un activo en dólares vale más pesos: hay ingreso.' : 'Si el dólar sube, una deuda en dólares cuesta más pesos: hay gasto.'));
      res.push(R(ganancia ? 'Ingreso por diferencia en cambio' : 'Gasto por diferencia en cambio', m, 'money', 0, true), R('Valor al inicio', ini, 'money'), R('Valor al cierre', fin, 'money'));
      const cta = v.nat === 'A' ? '1305 Cuenta por cobrar en moneda extranjera' : '2205 Cuenta por pagar en moneda extranjera';
      asiento = { title: 'Asiento del ajuste', rows: v.nat === 'A' ? (d >= 0 ? [[cta, m, 0], ['4210 Ingresos financieros (diferencia en cambio)', 0, m]] : [['5305 Gastos financieros (diferencia en cambio)', m, 0], [cta, 0, m]]) : (d >= 0 ? [['5305 Gastos financieros (diferencia en cambio)', m, 0], [cta, 0, m]] : [[cta, m, 0], ['4210 Ingresos financieros (diferencia en cambio)', 0, m]]) };
      interp = 'La diferencia en cambio no realizada se reconoce al cierre aunque no se haya movido dinero. Cuando la partida se cobra o se paga, se reconoce la diferencia faltante.';
    } else if (v.calc === 'ipc') {
      const adj = v.valor * (1 + v.inf);
      steps.push(S('Calcular el factor de inflación', `1 + ${F.pct(v.inf, 2)} = ${F.num(1 + v.inf, 4)}`, 'Es cuántas veces creció el nivel de precios.'));
      steps.push(S('Multiplicar el valor', `${F.money(v.valor)} × ${F.num(1 + v.inf, 4)} = ${F.money(adj)}`, 'El valor ajustado conserva el poder de compra del valor original.'));
      res.push(R('Valor ajustado', adj, 'money', 0, true), R('Incremento', adj - v.valor, 'money'));
      interp = 'En Colombia el ajuste integral por inflación de los estados financieros se eliminó en 2007. Hoy la inflación se usa para actualizar valores como arriendos, salarios y créditos en UVR.';
    } else {
      const real = (1 + v.nom) / (1 + v.inf) - 1;
      steps.push(S('Dividir los factores', `(1 + ${F.pct(v.nom, 2)}) ÷ (1 + ${F.pct(v.inf, 2)}) = ${F.num((1 + v.nom) / (1 + v.inf), 6)}`, 'Se divide, no se resta: la inflación reduce el poder de compra del dinero que se recibe.'));
      steps.push(S('Restar 1', `Tasa real = ${F.pct(real, 4)}`, 'Es lo que realmente crece el poder de compra.'));
      res.push(R('Tasa real', real, 'pct', 4, true), R('Resta simple (aproximada)', v.nom - v.inf, 'pct', 2));
      interp = real < 0 ? 'La tasa real es negativa: la inversión pierde poder de compra.' : 'La tasa real positiva indica que la inversión gana poder de compra.';
    }
    return { res, steps, asiento, interp };
  }
});

const PCT_ = x => F.pct(x, 1);

// ---------- Rotación y días de inventario ----------
add({
  id: 'rotacion-inventario', group: 'inv', title: 'Rotación y días de inventario',
  purpose: 'Mide cuántas veces se renueva el inventario en un periodo y cuántos días dura en bodega. Sirve para detectar exceso de existencias, productos sin salida y capital inmovilizado.',
  formula: ['Inventario promedio = (Inventario inicial + Inventario final) ÷ 2', 'Rotación = Costo de ventas ÷ Inventario promedio', 'Días de inventario = Días del periodo ÷ Rotación'],
  vars: [['CV', 'Costo de ventas del periodo'], ['Promedio', 'Valor medio de las existencias del periodo'], ['Rotación', 'Veces que el inventario se vende y se repone'], ['Días', 'Tiempo promedio que dura el inventario']],
  fields: [
    fl('cv', 'Costo de ventas del periodo', 'money', 240000000),
    fl('ii', 'Inventario inicial', 'money', 30000000),
    fl('ifin', 'Inventario final', 'money', 50000000),
    fl('dias', 'Días del periodo', 'int', 365, { hint: '365 para un año; 30 para un mes' })
  ],
  compute(v) {
    const prom = (v.ii + v.ifin) / 2;
    if (!(prom > 0) || !(v.dias > 0)) return { error: 'El inventario promedio y los días del periodo deben ser mayores que cero.' };
    const rot = v.cv / prom, dias = v.dias / rot;
    const steps = [
      S('Calcular el inventario promedio', `(${F.money(v.ii)} + ${F.money(v.ifin)}) ÷ 2 = ${F.money(prom)}`, 'Se promedian el inicial y el final porque las existencias cambian durante el periodo.'),
      S('Calcular la rotación', `${F.money(v.cv)} ÷ ${F.money(prom)} = ${F.num(rot, 2)} veces`, 'Se usa el costo de ventas (no las ventas) para comparar el inventario con lo que costó lo vendido, ambos a costo.'),
      S('Calcular los días de inventario', `${v.dias} ÷ ${F.num(rot, 2)} = ${F.num(dias, 0)} días`, 'Es el tiempo promedio que tarda el inventario en venderse y reponerse.'),
      S('Interpretar', `El inventario se renueva aproximadamente cada ${F.num(dias, 0)} días`, 'Una rotación alta indica menos capital inmovilizado. Una rotación muy baja señala exceso de existencias o productos sin salida.')
    ];
    return { res: [R('Rotación de inventario (veces en el periodo)', rot, 'num', 2, true), R('Días de inventario', dias, 'num', 0), R('Inventario promedio', prom, 'money')], steps, interp: `El inventario rota ${F.num(rot, 2)} veces en ${v.dias} días y dura cerca de ${F.num(dias, 0)} días. Compare con periodos anteriores y con negocios del mismo sector: una rotación buena para una ferretería puede ser mala para un supermercado.` };
  }
});

// ---------- Clasificación ABC ----------
add({
  id: 'clasificacion-abc', group: 'inv', title: 'Clasificación ABC',
  purpose: 'Ordena los artículos por su valor anual y los separa en clase A (pocos artículos, mucho valor), B y C, para decidir dónde poner el control más estricto (regla 80/20 de Pareto).',
  formula: ['Valor anual = Cantidad × Costo unitario', '% del artículo = Valor del artículo ÷ Valor total', '% acumulado = suma de los % de los artículos ordenados de mayor a menor', 'A hasta el límite A; B hasta el límite B; C el resto'],
  vars: [['Valor anual', 'Lo que se compra o vende de cada artículo en el año'], ['% acumulado', 'Aporte sumado, del artículo más valioso al menos valioso'], ['Límites', 'Orientativos: A cerca del 80 %, B hasta cerca del 95 %']],
  fields: [
    fl('items', 'Artículos y su valor anual', 'rows', [
      { a: 'Tornillos', v: 6000000 }, { a: 'Taladros', v: 36000000 }, { a: 'Cables', v: 18000000 }, { a: 'Cinta aislante', v: 2000000 },
      { a: 'Pintura', v: 24000000 }, { a: 'Brochas', v: 4000000 }, { a: 'Candados', v: 8000000 }, { a: 'Guantes', v: 2000000 }
    ], { cols: [{ id: 'a', label: 'Artículo', kind: 'text' }, { id: 'v', label: 'Valor anual', kind: 'money' }], hint: 'Valor anual = cantidad × costo unitario. Puede agregar o quitar filas; la calculadora las ordena sola.' }),
    fl('la', 'Límite de la clase A (% acumulado)', 'pct', 80),
    fl('lb', 'Límite de la clase B (% acumulado)', 'pct', 95)
  ],
  compute(v) {
    const items = v.items.map((x, i) => ({ a: String(x.a).trim() || 'Artículo ' + (i + 1), v: x.v })).filter(x => x.v > 0);
    if (items.length < 2) return { error: 'Ingrese al menos dos artículos con valor mayor que cero.' };
    if (!(v.lb > v.la)) return { error: 'El límite de la clase B debe ser mayor que el de la clase A.' };
    items.sort((x, y) => y.v - x.v);
    const total = items.reduce((s, x) => s + x.v, 0), n = items.length; let acc = 0;
    const rows = items.map((x, i) => {
      acc += x.v; const cum = acc / total, cls = i === 0 || cum <= v.la + 1e-9 ? 'A' : cum <= v.lb + 1e-9 ? 'B' : 'C';
      x.cls = cls; return [x.a, x.v, x.v / total, cum, cls];
    });
    const G = c => { const L = items.filter(x => x.cls === c), val = L.reduce((s, x) => s + x.v, 0); return { n: L.length, val }; };
    const gA = G('A'), gB = G('B'), gC = G('C');
    const resumen = [['Clase A', gA.n, gA.n / n, gA.val, gA.val / total], ['Clase B', gB.n, gB.n / n, gB.val, gB.val / total], ['Clase C', gC.n, gC.n / n, gC.val, gC.val / total], ['Total', n, 1, total, 1]];
    const txt = g => `${g.n} artículos (${PCT_(g.n / n)}) = ${PCT_(g.val / total)} del valor`;

add({

  fields: [

    fl('ua', 'Puntaje mínimo para aprobar', 'num', 4), fl('uc', 'Puntaje mínimo para quedar condicionado', 'num', 3)
  ],
  compute(v) {
    const C = v.crit.filter(x => x.w > 0 || x.a > 0 || x.b > 0 || x.k > 0);
    if (!C.length) return { error: 'Agregue al menos un criterio.' };
    const sw = C.reduce((s, x) => s + x.w, 0);
    if (Math.abs(sw - 1) > 0.0005) return { error: `Los pesos deben sumar 100 %. Ahora suman ${F.pct(sw, 1)}.` };
    if (C.some(x => [x.a, x.b, x.k].some(z => z < 0 || z > 5))) return { error: 'Las calificaciones deben estar entre 1 y 5 (o 0 si no evalúa a ese proveedor).' };
    const prov = [['A', 'a'], ['B', 'b']]; if (C.some(x => x.k > 0)) prov.push(['C', 'k']);
    const sc = {}; prov.forEach(([n, k]) => { sc[k] = C.reduce((s, x) => s + x[k] * x.w, 0); });
    const cls = s => (s >= v.ua ? 'Aprobado' : s >= v.uc ? 'Condicionado (plan de mejora)' : 'Descalificado');

    const rows = C.map((x, i) => { const r = [String(x.c).trim() || 'Criterio ' + (i + 1), x.w]; prov.forEach(([n, kk]) => { r.push(x[kk], x[kk] * x.w); }); return r; });
    const tot = ['Total', sw]; prov.forEach(([n, kk]) => { tot.push(null, sc[kk]); }); rows.push(tot);
    const best = prov.reduce((a, b) => (sc[b[1]] > sc[a[1]] ? b : a));
    const tie = prov.filter(p => Math.abs(sc[p[1]] - sc[best[1]]) < 1e-9).length > 1;
    const res = [R('Proveedor con mayor puntaje', tie ? 'Empate: revise otros criterios' : `Proveedor ${best[0]} (${F.num(sc[best[1]], 2)} de 5)`, 'text', 0, true)];
    prov.forEach(([n, kk]) => res.push(R('Proveedor ' + n, `${F.num(sc[kk], 2)} · ${cls(sc[kk])}`, 'text')));
    const steps = [
      S('Verificar los pesos', `Σ pesos = ${F.pct(sw, 0)}`, 'Si los pesos no suman 100 %, el puntaje no se puede comparar con la escala de 1 a 5.'),
      S('Multiplicar cada calificación por su peso', `${rows[0][0]}: ${F.num(C[0].a, 0)} × ${F.num(C[0].w, 2)} = ${F.num(C[0].a * C[0].w, 2)} (Proveedor A)`, 'Los criterios más importantes pesan más en el resultado.'),
      S('Sumar por proveedor', prov.map(([n, kk]) => `Proveedor ${n} = ${F.num(sc[kk], 2)}`).join(';  '), 'El puntaje total resume el desempeño en una sola cifra.'),
      S('Decidir', tie ? 'Hay empate: use otros criterios' : `Se elige el Proveedor ${best[0]} (${F.num(sc[best[1]], 2)})`, 'Aprobado: se elige o se mantiene. Condicionado: se pide un plan de mejora. Descalificado: se busca otro proveedor.')
    ];
    return { res, steps, table: { title: 'Matriz de calificación ponderada', h, k, rows }, interp: 'Elija al de mayor puntaje, pero revise los criterios donde el segundo quedó bajo: se le puede pedir un plan de mejora. No concentre las compras críticas en un solo proveedor; tenga siempre un proveedor alterno.' };
  }
});
