const ejOps=()=>`<ol class="ej">${OPS.map(o=>`<li><span class="f">${o.f}.</span> ${o.t}</li>`).join("")}</ol>`;
const diarioRef=()=>`<details><summary>Ver el libro diario resuelto (referencia)</summary><div class="tw"><table><thead><tr><th>Asiento</th><th>Fecha</th><th>Código</th><th>Cuenta</th><th class="n">Débito</th><th class="n">Crédito</th></tr></thead><tbody>${OPS.map((o,i)=>o.l.map(l=>`<tr><td>${i+1}</td><td>${o.f}</td><td>${l[0]}</td><td>${CAT[l[0]]}</td><td class="n">${l[1]?fmt(l[1]):""}</td><td class="n">${l[2]?fmt(l[2]):""}</td></tr>`).join("")).join("")}</tbody></table></div></details>`;
const catRef=()=>`<details><summary>Ver el catálogo de cuentas (PUC)</summary><div class="tw"><table style="min-width:0"><tbody>${Object.entries(CAT).map(([c,n])=>`<tr><td>${c}</td><td>${n}</td></tr>`).join("")}</tbody></table></div></details>`;

function intro(d){
  return `<div class="band"><span class="eyebrow">Día ${d.n}${d.sub?" · "+d.sub:""}</span><h2>${d.t}</h2></div>
  <div class="cols"><div class="box"><h3>¿Qué es?</h3><p>${d.que}</p></div>
  <div class="box"><h3>Paso a paso</h3><ol>${d.pasos.map(p=>`<li>${p}</li>`).join("")}</ol></div></div>`;
}
function footer(n){
  return `<div class="foot"><p class="score">Día ${n}: <b id="sc${n}">0</b></p><div class="btns" id="rb${n}">
  <button class="btn" data-reset="${n}">Reiniciar día</button>${n<5?`<button class="btn pri" data-go="${n+1}">Siguiente día →</button>`:""}</div></div>`;
}

function day1(){
  let h=`<div class="box"><h3>El ejercicio</h3><p>Registra en el libro diario las operaciones de noviembre de Papelería Aprende S.A.S.:</p>${ejOps()}</div>${catRef()}<h3>Tu libro diario</h3>`;
  OPS.forEach((o,i)=>{
    h+=`<div class="asiento"><div class="ahead"><span class="lbl">Asiento ${i+1} · ${o.f}</span><span class="note">${o.t}</span></div><div class="tw"><table><thead><tr><th>Código</th><th>Cuenta</th><th class="n">Débito</th><th class="n">Crédito</th><th class="ic">✓</th></tr></thead><tbody>`;
    o.l.forEach((_,j)=>{const k=`d1-${i}-${j}`;
      h+=`<tr><td><select class="cel" id="${k}-c" data-k="${k}-c" aria-label="Código asiento ${i+1} línea ${j+1}">${codeOpts}</select></td><td class="cuenta" id="${k}-n"></td><td>${numIn(k+"-d","Débito")}</td><td>${numIn(k+"-cr","Crédito")}</td><td class="ic" id="${k}-i"></td></tr>`});
    h+=`<tr class="sum"><td></td><td><span class="msg" id="d1-${i}-m"></span></td><td class="n" id="d1-${i}-sd">0</td><td class="n" id="d1-${i}-sc">0</td><td></td></tr></tbody></table></div></div>`;
  });
  return h;
}
function day2(){
  let h=`<div class="box"><h3>El ejercicio</h3><p>Con los asientos del Día 1, lleva los auxiliares de cuatro cuentas: Caja, Bancos, Clientes (Colegio San José) y Proveedores (Distribuidora Escolar S.A.S.). Ya tienes la fecha y el detalle de cada línea. Tú escribes el valor en Débito o en Crédito y calculas el saldo.</p><p class="note">Recuerda: Proveedores es una cuenta de pasivo, así que su saldo crece con los créditos.</p></div>${diarioRef()}<div class="aux">`;
  AUX.forEach((a,i)=>{
    h+=`<div class="asiento"><div class="ahead"><span class="lbl">Auxiliar ${a.c} · ${a.n}</span><span class="note">Cuenta de ${a.tipo}: saldo = anterior ${a.tipo==="activo"?"+ débito − crédito":"+ crédito − débito"}</span></div><div class="tw"><table><thead><tr><th>Fecha</th><th>Detalle</th><th class="n">Débito</th><th class="n">Crédito</th><th class="n">Saldo</th><th class="ic">✓</th></tr></thead><tbody>`;
    a.r.forEach((r,j)=>{const k=`d2-${i}-${j}`;
      h+=`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${numIn(k+"-d","Débito")}</td><td>${numIn(k+"-cr","Crédito")}</td><td>${numIn(k+"-s","Saldo")}</td><td class="ic" id="${k}-i"></td></tr>`});
    h+=`</tbody></table></div></div>`;
  });
  return h+`</div>`;
}
function day3(){
  let h=`<div class="box"><h3>El ejercicio</h3><p>Pasa al libro mayor las 10 cuentas que tuvieron movimiento en noviembre. Para cada una, suma sus débitos y sus créditos del libro diario, calcula el saldo y elige si es deudor o acreedor.</p><p class="note">Ejemplo: Caja tiene débitos de 2.000.000 y 1.000.000 (total 3.000.000) y un crédito de 800.000. Su saldo es 2.200.000 deudor.</p></div>${diarioRef()}
  <div class="tw"><table><thead><tr><th>Código</th><th>Cuenta</th><th class="n">Total débitos</th><th class="n">Total créditos</th><th class="n">Saldo</th><th>Naturaleza</th><th class="ic">✓</th></tr></thead><tbody>`;
  MAY.forEach((m,i)=>{const k=`d3-${i}`;
    h+=`<tr><td>${m[0]}</td><td class="cuenta">${CAT[m[0]]}</td><td>${numIn(k+"-d","Total débitos")}</td><td>${numIn(k+"-cr","Total créditos")}</td><td>${numIn(k+"-s","Saldo")}</td><td><select class="cel" id="${k}-nt" data-k="${k}-nt" aria-label="Naturaleza"><option value="">—</option><option>Deudor</option><option>Acreedor</option></select></td><td class="ic" id="${k}-i"></td></tr>`});
  return h+`</tbody></table></div>`;
}
function day4(){
  let h=`<div class="box"><h3>El ejercicio</h3><p>Arma el balance de comprobación de Papelería Aprende S.A.S. al 30 de noviembre de 2026. Usa los saldos del Día 3: cada saldo va en su columna (Deudor o Acreedor). Al final suma las dos columnas.</p></div>
  <div class="tw"><table><thead><tr><th>Código</th><th>Cuenta</th><th class="n">Saldo deudor</th><th class="n">Saldo acreedor</th><th class="ic">✓</th></tr></thead><tbody>`;
  MAY.forEach((m,i)=>{const k=`d4-${i}`;
    h+=`<tr><td>${m[0]}</td><td class="cuenta">${CAT[m[0]]}</td><td>${numIn(k+"-d","Saldo deudor")}</td><td>${numIn(k+"-cr","Saldo acreedor")}</td><td class="ic" id="${k}-i"></td></tr>`});
  h+=`<tr class="sum"><td></td><td>TOTALES <span class="msg" id="d4-m"></span></td><td>${numIn("d4-td","Total deudor")}</td><td>${numIn("d4-tc","Total acreedor")}</td><td class="ic" id="d4-ti"></td></tr>`;
  return h+`</tbody></table></div>`;
}
function day5(){
  let h=`<div class="box"><h3>El ejercicio</h3><p><b>A.</b> El inventario de mercancías de la papelería tiene este detalle: 100 cuadernos de 100 hojas a $12.000 cada uno, 50 cajas de colores x 12 a $20.000 cada una y 40 resmas de papel carta a $20.000 cada una. Calcula el valor de cada artículo y el total.</p><p><b>B.</b> Clasifica cada cuenta como Activo, Pasivo, Patrimonio, Ingreso o Gasto.</p><p><b>C.</b> Con los saldos del Día 3, calcula los totales del estado de situación financiera al 30 de noviembre de 2026.</p><p class="note">Simplificación: en este taller no se registra el costo de ventas, por eso el inventario conserva el valor de la compra.</p></div>
  <h3>A. Inventario detallado de mercancías</h3><div class="tw"><table><thead><tr><th>Artículo</th><th class="n">Cantidad</th><th class="n">Valor unitario</th><th class="n">Valor total</th><th class="ic">✓</th></tr></thead><tbody>`;
  INV.forEach((v,i)=>{h+=`<tr><td>${v[0]}</td><td class="n">${v[1]}</td><td class="n">${fmt(v[2])}</td><td>${numIn(`d5-i${i}`,"Valor total")}</td><td class="ic" id="d5-i${i}-i"></td></tr>`});
  h+=`<tr class="sum"><td colspan="3">Total inventario (debe coincidir con la cuenta 1435)</td><td>${numIn("d5-it","Total inventario")}</td><td class="ic" id="d5-it-i"></td></tr></tbody></table></div>
  <h3>B. Clasificación de las cuentas</h3><div class="tw"><table><thead><tr><th>Código</th><th>Cuenta</th><th class="n">Saldo</th><th>Clase</th><th class="ic">✓</th></tr></thead><tbody>`;
  MAY.forEach((m,i)=>{h+=`<tr><td>${m[0]}</td><td class="cuenta">${CAT[m[0]]}</td><td class="n">${fmt(m[3])}</td><td><select class="cel" id="d5-c${i}" data-k="d5-c${i}" aria-label="Clase"><option value="">—</option>${["Activo","Pasivo","Patrimonio","Ingreso","Gasto"].map(x=>`<option>${x}</option>`).join("")}</select></td><td class="ic" id="d5-c${i}-i"></td></tr>`});
  h+=`</tbody></table></div><h3>C. Estado de situación financiera</h3><div class="tw"><table style="min-width:420px"><tbody>`;
  TOT.forEach((t,i)=>{h+=`<tr><td>${t[0]}</td><td style="width:200px">${numIn(`d5-t${i}`,t[0])}</td><td class="ic" id="d5-t${i}-i"></td></tr>`});
  h+=`</tbody></table></div><div class="box"><h3>Evaluación final · 5 preguntas</h3>`;
  EVAL.forEach((q,i)=>{h+=`<div class="q"><p><b>${i+1}.</b> ${q.q}</p>${q.o.map((o,j)=>`<label id="q${i}-${j}-l"><input type="radio" name="q${i}" id="q${i}-${j}" data-k="q${i}" value="${j}"> ${o}</label>`).join("")}<p class="exp" id="q${i}-e" hidden>${q.e}</p></div>`});
  return h+`</div>`;
}

// ---------- render ----------
const tabs=$("#tabs"), days=$("#days");
DAYS.forEach(d=>{
  tabs.insertAdjacentHTML("beforeend",`<button class="tab" role="tab" id="tab${d.n}" aria-selected="false" style="--dc:var(--${d.c});--ds:var(--${d.c}s)" data-go="${d.n}"><small>Día ${d.n}</small><span class="t">${d.t}${d.sub?" ("+d.sub.split(" · ")[0].toLowerCase()+")":""}</span><span class="sc" id="tsc${d.n}">0 %</span></button>`);
  const body=[day1,day2,day3,day4,day5][d.n-1]();
  days.insertAdjacentHTML("beforeend",`<section class="day" id="day${d.n}" role="tabpanel" hidden style="--dc:var(--${d.c});--ds:var(--${d.c}s)">${intro(d)}${body}${footer(d.n)}</section>`);
});

// restaurar valores
$$("[data-k]").forEach(el=>{const v=store[el.dataset.k]; if(v==null)return;
  if(el.type==="radio") el.checked=(el.value===v); else if(el.tagName==="SELECT") el.value=v; else el.value=el.classList.contains("num")&&parse(v)!=null?fmt(parse(v)):v;});

// ---------- revisión ----------
const mark=(el,s)=>{if(!el)return;el.classList.remove("ok","err");if(s)el.classList.add(s)};
const icon=(el,s)=>{mark(el,s);el.textContent=s==="ok"?"✔":s==="err"?"✘":""};
// e: valor esperado (0 = vacío o cero). Devuelve [estado, correcto]
function chk(id,e){const el=$("#"+id),v=parse(el.value);let s="",c;
  if(e>0){c=v===e; s=v===null?"":(c?"ok":"err")} else {c=(v===null||v===0); s=v===null?"":(v===0?"ok":"err")}
  mark(el,s); return [s,c,v];}
const rowState=(states,allOk,anyFilled)=>allOk?"ok":(states.includes("err")?"err":(anyFilled&&false?"err":""));

const sc={};
function check(){
  // Día 1
  let ok1=0,tot1=0;
  OPS.forEach((o,i)=>{let sd=0,scr=0; const used={};
    o.l.forEach((_,j)=>{const k=`d1-${i}-${j}`;tot1++;
      const sel=$(`#${k}-c`),code=sel.value,dEl=$(`#${k}-d`),cEl=$(`#${k}-cr`);
      const dv=parse(dEl.value),cv=parse(cEl.value); sd+=dv||0; scr+=cv||0;
      $(`#${k}-n`).textContent=code?CAT[code]:"";
      const sol=o.l.find(l=>String(l[0])===code); used[code]=(used[code]||0)+1;
      let codeOk=!!sol&&used[code]===1;
      mark(sel,code?(codeOk?"ok":"err"):"");
      let st="",good=false;
      if(codeOk){const a=chk(`${k}-d`,sol[1]),b=chk(`${k}-cr`,sol[2]);
        good=a[1]&&b[1]&&(a[2]!==null||b[2]!==null);
        st=good?"ok":(a[0]==="err"||b[0]==="err"?"err":"");}
      else {mark(dEl,"");mark(cEl,""); st=code?"err":"";}
      icon($(`#${k}-i`),st); if(good)ok1++;});
    $(`#d1-${i}-sd`).textContent=fmt(sd); $(`#d1-${i}-sc`).textContent=fmt(scr);
    const m=$(`#d1-${i}-m`); if(!sd&&!scr){mark(m,"");m.textContent=""} else if(sd===scr){mark(m,"ok");m.textContent="✔ Sumas iguales"} else {mark(m,"err");m.textContent="✘ Las sumas no cuadran"}
  });
  sc[1]=[ok1,tot1];
  // Día 2
  let ok2=0,tot2=0;
  AUX.forEach((a,i)=>a.r.forEach((r,j)=>{const k=`d2-${i}-${j}`;tot2++;
    const x=[chk(k+"-d",r[2]),chk(k+"-cr",r[3]),chk(k+"-s",r[4])];
    const good=x.every(z=>z[1]); if(good)ok2++;
    icon($(`#${k}-i`),good?"ok":(x.some(z=>z[0]==="err")?"err":""));}));
  sc[2]=[ok2,tot2];
  // Día 3
  let ok3=0;
  MAY.forEach((m,i)=>{const k=`d3-${i}`;
    const x=[chk(k+"-d",m[1]),chk(k+"-cr",m[2]),chk(k+"-s",m[3])];
    const nt=$(`#${k}-nt`); const ntOk=nt.value===m[4]; mark(nt,nt.value?(ntOk?"ok":"err"):"");
    const good=x.every(z=>z[1])&&ntOk; if(good)ok3++;
    icon($(`#${k}-i`),good?"ok":(x.some(z=>z[0]==="err")||(nt.value&&!ntOk)?"err":""));});
  sc[3]=[ok3,MAY.length];
  // Día 4
  let ok4=0,sumD=0,sumC=0;
  MAY.forEach((m,i)=>{const k=`d4-${i}`;const deu=m[4]==="Deudor";
    const a=chk(k+"-d",deu?m[3]:0),b=chk(k+"-cr",deu?0:m[3]); sumD+=a[2]||0; sumC+=b[2]||0;
    const good=a[1]&&b[1]; if(good)ok4++;
    icon($(`#${k}-i`),good?"ok":(a[0]==="err"||b[0]==="err"?"err":""));});
  const t1=chk("d4-td",16260000),t2=chk("d4-tc",16260000);
  const tg=t1[1]&&t2[1]; if(t1[1])ok4++; if(t2[1])ok4++;
  icon($("#d4-ti"),tg?"ok":(t1[0]==="err"||t2[0]==="err"?"err":""));
  const m4=$("#d4-m"); if(t1[2]!=null&&t2[2]!=null){const eq=t1[2]===t2[2];mark(m4,eq?"ok":"err");m4.textContent=eq?"✔ Cuadra":"✘ No cuadra"} else {mark(m4,"");m4.textContent=""}
  sc[4]=[ok4,MAY.length+2];
  // Día 5
  let ok5=0,tot5=0;
  INV.forEach((v,i)=>{tot5++;const a=chk(`d5-i${i}`,v[1]*v[2]); if(a[1])ok5++; icon($(`#d5-i${i}-i`),a[0])});
  tot5++; {const a=chk("d5-it",3000000); if(a[1])ok5++; icon($("#d5-it-i"),a[0])}
  MAY.forEach((m,i)=>{tot5++;const s=$(`#d5-c${i}`),g=s.value===CLASE[m[0]]; mark(s,s.value?(g?"ok":"err"):""); icon($(`#d5-c${i}-i`),s.value?(g?"ok":"err"):""); if(g)ok5++});
  TOT.forEach((t,i)=>{tot5++;const a=chk(`d5-t${i}`,t[1]); if(a[1])ok5++; icon($(`#d5-t${i}-i`),a[0])});
  let okE=0;
  EVAL.forEach((q,i)=>{q.o.forEach((_,j)=>mark($(`#q${i}-${j}-l`),""));
    const r=$(`input[name="q${i}"]:checked`); const e=$(`#q${i}-e`);
    if(r){const j=+r.value,g=j===q.a; mark($(`#q${i}-${j}-l`),g?"ok":"err"); if(g)okE++; e.hidden=false} else e.hidden=true;});
  sc[5]=[ok5,tot5,okE,EVAL.length];

  // puntajes
  const pct={1:ok1/tot1,2:ok2/tot2,3:ok3/MAY.length,4:ok4/(MAY.length+2),5:0.5*ok5/tot5+0.5*okE/EVAL.length};
  $("#sc1").textContent=`${ok1} de ${tot1} líneas correctas`;
  $("#sc2").textContent=`${ok2} de ${tot2} líneas correctas`;
  $("#sc3").textContent=`${ok3} de ${MAY.length} cuentas correctas`;
  $("#sc4").textContent=`${ok4} de ${MAY.length+2} correctas`;
  $("#sc5").textContent=`actividad ${ok5} de ${tot5} · evaluación ${okE} de ${EVAL.length}`;
  let nota=0; for(let n=1;n<=5;n++){nota+=2*pct[n]; $("#tsc"+n).textContent=Math.round(pct[n]*100)+" %"}
  $("#nota").textContent=(Math.round(nota*10)/10).toLocaleString("es-CO",{minimumFractionDigits:1,maximumFractionDigits:1});
}

// ---------- eventos ----------
function show(n){curDay=n;if(typeof renderSheet==="function"&&!$("#sheet").hidden)renderSheet();DAYS.forEach(d=>{$("#day"+d.n).hidden=d.n!==n;$("#tab"+d.n).setAttribute("aria-selected",d.n===n)});
  try{localStorage.setItem("libros5dias-tab",n)}catch(e){}}
document.addEventListener("input",e=>{const el=e.target;if(!el.dataset.k)return;
  store[el.dataset.k]=el.type==="radio"?el.value:el.value; save(); check();});
document.addEventListener("change",e=>{const el=e.target;if(!el.dataset.k)return;store[el.dataset.k]=el.value;save();check();});
document.addEventListener("focusout",e=>{const el=e.target;if(el.classList&&el.classList.contains("num")){const v=parse(el.value);if(v!=null)el.value=fmt(v)}});
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g){show(+g.dataset.go); if(!g.classList.contains("tab"))window.scrollTo({top:0}); return;}
  const r=e.target.closest("[data-reset]"); if(r){const n=r.dataset.reset,box=$("#rb"+n);
    box.dataset.html=box.innerHTML;
    box.innerHTML=`<span class="confirm">¿Borrar todo lo del Día ${n}? <button class="btn pri" data-yes="${n}">Sí, borrar</button><button class="btn" data-no="${n}">Cancelar</button></span>`; return;}
  const y=e.target.closest("[data-yes]"); if(y){const n=y.dataset.yes;
    $$(`#day${n} [data-k]`).forEach(el=>{delete store[el.dataset.k]; if(el.type==="radio")el.checked=false; else el.value=""});
    save(); check(); const box=$("#rb"+n); box.innerHTML=box.dataset.html; return;}
  const no=e.target.closest("[data-no]"); if(no){const box=$("#rb"+no.dataset.no); box.innerHTML=box.dataset.html;}
});

// ---------- panel del ejercicio ----------
let curDay=1, sheetView="ej";
function renderSheet(){
  const sec=$("#day"+curDay); if(!sec)return;
  const d=DAYS[curDay-1];
  $("#sheet").style.setProperty("--dc","var(--"+d.c+")");
  $("#fab").style.setProperty("--dc","var(--"+d.c+")");
  $("#sheetDay").textContent="Día "+curDay+" · "+d.t;
  $$(".stab").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.sv===sheetView)));
  const boxes=[...sec.querySelectorAll(".box")];
  const src=sheetView==="ej"?boxes.find(b=>b.querySelector("h3")&&b.querySelector("h3").textContent.trim()==="El ejercicio"):sec.querySelector(".cols .box:nth-child(2)");
  const body=$("#sheetBody"); body.textContent="";
  if(src){const c=src.cloneNode(true); c.removeAttribute("id"); body.appendChild(c);}
}
function setSheet(open){
  $("#sheet").hidden=!open; $("#fab").hidden=open;
  $("#fab").setAttribute("aria-expanded",String(open));
  document.documentElement.classList.toggle("sheet-open",open);
  if(open)renderSheet();
}
$("#fab").addEventListener("click",()=>setSheet(true));
$("#sheetClose").addEventListener("click",()=>setSheet(false));
document.addEventListener("click",e=>{const b=e.target.closest("[data-sv]"); if(b){sheetView=b.dataset.sv;renderSheet();}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden)setSheet(false)});

let start=1; try{start=+localStorage.getItem("libros5dias-tab")||1}catch(e){}
show(start>=1&&start<=5?start:1); check();
</script>

</body></html>
