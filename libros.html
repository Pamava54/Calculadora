<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Libros Contables en 5 Días</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: cuaderno de trabajo por días — pestañas de día arriba, cada día con su color suave, explicación, ejercicio escrito y tabla para llenar */
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --ink:#1C2632; --muted:#5A6777; --line:#D7DEE7;
  --input:#FFF8DC; --ok:#17713F; --okbg:#DCF2E3; --err:#B3261E; --errbg:#FCE2DF;
  --d1:#3A6BA0; --d1s:#E5EDF7; --d2:#357F62; --d2s:#E2F1EA; --d3:#A86F14; --d3s:#F8EEDC;
  --d4:#65569E; --d4s:#ECE8F6; --d5:#B65345; --d5s:#F8E5E1;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161C; --surface:#19212A; --ink:#E5EAF0; --muted:#9BA8B6; --line:#2C3743;
  --input:#2B2817; --ok:#74D49C; --okbg:#173826; --err:#FF8E84; --errbg:#44201C;
  --d1:#8DB5E3; --d1s:#1C2A3B; --d2:#82C9A9; --d2s:#18302A; --d3:#E5B464; --d3s:#33291A;
  --d4:#B5A8E6; --d4s:#272338; --d5:#EE9C8F; --d5s:#3A2320; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161C; --surface:#19212A; --ink:#E5EAF0; --muted:#9BA8B6; --line:#2C3743;
  --input:#2B2817; --ok:#74D49C; --okbg:#173826; --err:#FF8E84; --errbg:#44201C;
  --d1:#8DB5E3; --d1s:#1C2A3B; --d2:#82C9A9; --d2s:#18302A; --d3:#E5B464; --d3s:#33291A;
  --d4:#B5A8E6; --d4s:#272338; --d5:#EE9C8F; --d5s:#3A2320; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.back{display:inline-block;margin-bottom:8px;color:var(--d1);font-weight:700;text-decoration:none}
.back:hover{text-decoration:underline}
.top .sub{color:var(--muted);margin-top:4px}
.who{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.who label{font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.who input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--input);color:var(--ink);min-width:0;width:220px;max-width:100%}
.nota{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;text-align:center}
.nota b{font-family:var(--f-display);font-size:1.6rem;display:block;font-variant-numeric:tabular-nums}
.nota span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tab{flex:1 0 150px;font:inherit;text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;border-top:4px solid var(--dc)}
.tab small{color:var(--muted);font-size:.78rem}
.tab .t{font-weight:700;font-size:.95rem}
.tab .sc{font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--dc);font-weight:700}
.tab[aria-selected="true"]{background:var(--ds);border-color:var(--dc)}
.tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--dc,var(--d1));outline-offset:2px}
.day{display:flex;flex-direction:column;gap:16px}
.band{background:var(--ds);border-left:6px solid var(--dc);border-radius:8px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.band .eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dc);font-weight:700}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.cols{grid-template-columns:1fr}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.box ol,.box ul{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.ej{display:flex;flex-direction:column;gap:10px}
.ej li{padding-left:2px}
.ej .f{font-weight:700;color:var(--dc)}
.note{font-size:.88rem;color:var(--muted)}
.exp1{border-left:5px solid var(--dc);background:var(--ds)}
.exp1 summary{color:var(--dc)}
.exp1 p{margin:6px 0}
.mov{list-style:none;padding:0!important;margin:8px 0!important;display:flex;flex-direction:column;gap:8px}
.mov li{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.lado{flex:0 0 auto;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:4px;padding:2px 8px;margin-top:2px}
.lado.deb{background:var(--d2s);color:var(--d2);border:1px solid var(--d2)}
.lado.cre{background:var(--d4s);color:var(--d4);border:1px solid var(--d4)}
.cuadra{font-weight:700;color:var(--ok)}
.vals{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.val{display:inline-flex;flex-direction:column;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 10px;line-height:1.25}
.val small{font-size:.72rem;color:var(--muted)}
.val b{font-variant-numeric:tabular-nums;font-size:.95rem;color:var(--ink)}
.val.iva{border-color:var(--d1);background:var(--d1s)}
.val.iva small,.val.iva b{color:var(--d1)}
.val.ret{border-color:var(--d5);background:var(--d5s)}
.val.ret small,.val.ret b{color:var(--d5)}
details{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
details summary{cursor:pointer;font-weight:700}
details[open] summary{margin-bottom:10px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:620px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:middle}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--bg);font-weight:700}
td.n{text-align:right}
th,th.n{text-align:center}
.asiento{display:flex;flex-direction:column;gap:8px}
.ahead{display:flex;flex-direction:column;gap:2px}
.ahead .lbl{font-weight:700;color:var(--dc)}
input.num,select.cel{font:inherit;font-size:.95rem;width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--input);color:var(--ink);font-variant-numeric:tabular-nums}
input.num{text-align:right;min-width:110px}
select.cel{min-width:90px}
select.cel[data-k$="-c"]{min-width:230px}
.ok{background:var(--okbg)!important;border-color:var(--ok)!important;color:var(--ok)!important}
.err{background:var(--errbg)!important;border-color:var(--err)!important;color:var(--err)!important}
.ic{width:42px;text-align:center;font-weight:800;font-size:1.05rem}
.ic.ok,.ic.err{border-radius:5px}
.cuenta{color:var(--muted);font-size:.92rem;min-width:180px}
tr.sum td{background:var(--bg);font-weight:700}
.msg{font-size:.88rem;font-weight:700;padding:2px 8px;border-radius:5px;display:inline-block}
.foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px}
.score{font-family:var(--f-display);font-size:1.15rem}
.score b{color:var(--dc)}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;cursor:pointer;border-radius:6px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.pri{background:var(--dc);border-color:var(--dc);color:var(--surface);font-weight:700}
.confirm{display:flex;gap:8px;align-items:center;font-size:.9rem}
.aux{display:grid;grid-template-columns:1fr;gap:16px}
.q{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q label{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.q .exp{font-size:.88rem;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.85rem;color:var(--muted);align-items:center}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--line);vertical-align:-2px;margin-right:4px}
@media (prefers-reduced-motion: no-preference){.tab,.btn{transition:background .15s,border-color .15s}}

.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:999px;padding:12px 18px;background:var(--dc,var(--d1));color:var(--surface);box-shadow:0 4px 16px rgba(0,0,0,.25)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:4px solid var(--dc,var(--d1));box-shadow:0 -6px 24px rgba(0,0,0,.2);max-height:42vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-in{width:100%;max-width:980px;margin:0 auto;min-height:0;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-h{display:flex;gap:8px;align-items:center;justify-content:space-between;padding-block:8px;border-bottom:1px solid var(--line)}
.sheet-t{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sheet-t .lbl{font-weight:700;color:var(--dc);margin-right:6px}
.stab{font:inherit;font-size:.9rem;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px}
.stab[aria-pressed="true"]{background:var(--dc);border-color:var(--dc);color:var(--surface);font-weight:700}
.sheet-b{overflow:auto;padding-block:10px;min-height:0}
.sheet-b .box{border:0;padding:0}
html.sheet-open{scroll-padding-bottom:46vh}
html.sheet-open .wrap{padding-bottom:calc(42vh + 24px)}
/* encabezado fijo: título, nombre, nota, leyenda y pestañas siempre visibles */
.stick{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;gap:12px;margin-inline:-16px;padding:10px 16px 10px;border-bottom:1px solid transparent}
.stick.mini{border-bottom-color:var(--line);box-shadow:0 6px 14px rgba(0,0,0,.08);gap:8px;padding-block:6px 8px}
.stick.mini .back,.stick.mini .top .sub{display:none}
.stick.mini h1{font-size:1.15rem}
.stick.mini .who label{flex-direction:row;align-items:center;gap:6px}
.stick.mini .who input{padding:4px 8px;width:180px}
.stick.mini .nota{padding:2px 12px;display:flex;align-items:baseline;gap:6px}
.stick.mini .nota b{font-size:1.15rem}
.stick.mini .legend{font-size:.78rem;gap:8px}
.stick.mini .legend span:last-child{display:none}
.stick.mini .tab{padding:5px 10px;flex-basis:130px}
.stick.mini .tab .t{font-size:.85rem}
@media (max-width:720px){
  .stick.mini .legend{display:none}
  .stick.mini .top{gap:6px;align-items:center}
  .stick.mini .who label{font-size:0}
  .stick.mini .who input{font-size:.9rem;width:150px}
  .tab{flex-basis:128px}
}
/* calculadora flotante (igual a la del Taller de asientos) */
.calc{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:50;width:min(310px,calc(100vw - 24px));font-family:var(--f-body)}
.calc:not(.open){width:auto}
.calc .ct{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:var(--d1);color:var(--surface);border:0;border-radius:12px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.calc.open .ct{border-radius:12px 12px 0 0}
.calc .cb{display:none;background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:10px;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.calc.open .cb{display:block}
.calc input{width:100%;font-family:ui-monospace,Consolas,monospace;font-size:16px;text-align:right;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--input);color:var(--ink)}
.calc .cr{font-family:ui-monospace,Consolas,monospace;font-size:20px;font-weight:700;text-align:right;min-height:1.6em;margin:6px 2px;word-break:break-all}
.calc .ck{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc .ck button{font:inherit;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 0;font-size:16px;font-weight:600;cursor:pointer;color:var(--ink)}
.calc .ck button.op{background:var(--d1s);color:var(--d1)}
.calc .ck button.eq{background:var(--d1);color:var(--surface);border-color:var(--d1)}
.calc .cc{display:flex;gap:6px;margin-top:8px}
.calc .cc button{font:inherit;flex:1;border:0;border-radius:8px;padding:7px;background:var(--d1s);color:var(--d1);font-weight:600;cursor:pointer}
.calc .ct span:first-child{white-space:nowrap}
.calc .ct small{font-size:.78rem}
@media (max-width:720px){.calc .ct small{display:none}}
</style>

</head><body>
<div class="wrap">
  <div class="stick" id="stick">
  <header class="top">
    <div>
      <a class="back" href="index.html">← Centro de Calculadoras</a>
      <h1>Los 4 libros contables en 5 días</h1>

    </div>
    <div class="who">
      <label for="nombre">Nombre del estudiante<input id="nombre" data-k="nombre" placeholder="Escribe tu nombre" autocomplete="off"></label>

    </div>

  <div class="sheet-in">
    <div class="sheet-h">
      <div class="sheet-t"><span class="lbl" id="sheetDay"></span><button class="stab" type="button" data-sv="ej" aria-pressed="true">Ejercicio</button><button class="stab" type="button" data-sv="pa" aria-pressed="false">Paso a paso</button></div>
      <button class="btn" type="button" id="sheetClose">Cerrar</button>

<div class="cb"><input id="calcE" type="text" inputmode="decimal" autocomplete="off" placeholder="Escribe: 6000000 * 19 / 100 y Enter" aria-label="Operación"><div class="cr" id="calcR" aria-live="polite"></div>
<div class="ck" id="calcK"></div><div class="cc"><button id="calcCp" type="button">Copiar resultado</button><button id="calcCl" type="button">Borrar</button></div></div></div>

<script>
const CAT={1105:"Caja",1110:"Bancos",1305:"Clientes",1355:"Anticipo de impuestos (retención en la fuente a favor)",1435:"Mercancías no fabricadas por la empresa",1524:"Equipo de oficina",1528:"Equipo de computación y comunicación",2205:"Proveedores nacionales",2335:"Costos y gastos por pagar",2365:"Retención en la fuente",2408:"Impuesto sobre las ventas por pagar (IVA)",3105:"Capital suscrito y pagado",4135:"Comercio al por mayor y al por menor",5120:"Arrendamientos",5135:"Servicios"};
// f: fecha · t: enunciado · v: valores que ve el estudiante · d: detalle para los auxiliares · l: [código, débito, crédito]
const OPS=[
 {f:"1-nov",t:"Se constituye Papelería Aprende S.A.S. Los socios suscriben y pagan un capital de $20.000.000: entregan $3.000.000 en efectivo y consignan $17.000.000 en la cuenta corriente de la empresa.",
  v:[["Efectivo",3000000],["Consignación",17000000],["Capital total",20000000]],d:"Aporte de los socios",x:{p:"Los dueños (socios) ponen dinero para arrancar el negocio. Ese dinero entra a la empresa por dos lados: una parte a la caja (billetes) y otra al banco.",w:["La caja recibe dinero, o sea que aumenta. Lo que aumenta en la empresa va al Débito.","El banco también recibe dinero y aumenta, así que también va al Débito.","¿De dónde salió el dinero? De los socios. Ese aporte es el patrimonio de los dueños y va al Crédito."]},
  l:[[1105,3000000,0],[1110,17000000,0],[3105,0,20000000]]},
 {f:"3-nov",t:"Compra mercancía a Distribuidora Escolar S.A.S. a crédito, factura electrónica FE-201. La empresa practica retención en la fuente por compras del 2,5 % sobre la base (sin IVA) y queda debiendo el neto.",
  v:[["Base",6000000],["IVA 19 %",1140000],["Total factura",7140000],["Retención 2,5 %",150000],["Neto por pagar",6990000]],d:"Factura de compra FE-201",x:{p:"La papelería compra cuadernos, colores y papel para venderlos, y no los paga todavía. Además se queda con un pedacito de la factura (la retención) porque la ley le pide entregárselo a la DIAN.",w:["Llega mercancía para vender: el inventario aumenta. Va al Débito solo por la base, sin IVA.","El IVA que pagamos al comprar después se puede descontar del IVA que cobremos en las ventas. Por eso va al Débito.","La retención (2,5 % de la base) no se le paga al proveedor: se le debe a la DIAN. Una deuda nueva va al Crédito.","Al proveedor le quedamos debiendo el total de la factura menos la retención: 7.140.000 − 150.000 = 6.990.000. Es una deuda, va al Crédito."]},
  l:[[1435,6000000,0],[2408,1140000,0],[2365,0,150000],[2205,0,6990000]]},
 {f:"5-nov",t:"Compra a Tecnoandes S.A.S. un computador para la caja y lo paga con transferencia. Se le practica retención del 2,5 % sobre la base. Ojo: el IVA de un activo fijo no es descontable; se suma al costo del computador.",
  v:[["Base",2800000],["IVA 19 %",532000],["Total factura",3332000],["Retención 2,5 %",70000],["Neto transferido",3262000]],d:"Compra de computador a Tecnoandes",x:{p:"La papelería compra un computador para usarlo en el negocio (no para venderlo). Lo paga desde el banco y retiene una parte para la DIAN.",w:["El computador es un bien de la empresa que aumenta: va al Débito. Aquí va por el total con IVA (2.800.000 + 532.000), porque el IVA de un activo fijo no se descuenta: se vuelve parte de lo que costó el equipo.","La retención (2,5 % de 2.800.000) no se le paga al vendedor: se le debe a la DIAN. Va al Crédito.","Del banco sale lo que de verdad se transfirió: 3.332.000 − 70.000 = 3.262.000. Si sale dinero, el banco disminuye y va al Crédito."]},

  h+=`<tr class="sum"><td colspan="3">Total inventario (debe coincidir con la cuenta 1435)</td><td>${numIn("d5-it","Total inventario")}</td><td class="ic" id="d5-it-i"></td></tr></tbody></table></div>
  <h3>B. Clasificación de las cuentas</h3><div class="tw"><table><thead><tr><th>Código</th><th>Cuenta</th><th class="n">Saldo</th><th>Clase</th><th class="ic">✓</th></tr></thead><tbody>`;
  MAY.forEach((m,i)=>{h+=`<tr><td>${m[0]}</td><td class="cuenta">${CAT[m[0]]}</td><td class="n">${fmt(m[3])}</td><td><select class="cel" id="d5-c${i}" data-k="d5-c${i}" aria-label="Clase"><option value="">—</option>${["Activo","Pasivo","Patrimonio","Ingreso","Gasto"].map(x=>`<option>${x}</option>`).join("")}</select></td><td class="ic" id="d5-c${i}-i"></td></tr>`});
  h+=`</tbody></table></div><h3>C. Estado de situación financiera</h3><div class="tw"><table style="min-width:420px"><tbody>`;
  TOT.forEach((t,i)=>{h+=`<tr><td>${t[0]}</td><td style="width:200px">${numIn(`d5-t${i}`,t[0])}</td><td class="ic" id="d5-t${i}-i"></td></tr>`});
  h+=`</tbody></table></div><div class="box"><h3>Evaluación final · 5 preguntas</h3>`;
  EVAL.forEach((q,i)=>{h+=`<div class="q"><p><b>${i+1}.</b> ${q.q}</p>${q.o.map((o,j)=>`<label id="q${i}-${j}-l"><input type="radio" name="q${i}" id="q${i}-${j}" data-k="q${i}" value="${j}"> ${o}</label>`).join("")}<p class="exp" id="q${i}-e" hidden>${q.e}</p></div>`});
  return h+`</div>`;
}

// ---------- render ----------
const tabs=$("#tabs"), days=$("#days");
DAYS.forEach(d=>{
  tabs.insertAdjacentHTML("beforeend",`<button class="tab" role="tab" id="tab${d.n}" aria-selected="false" style="--dc:var(--${d.c});--ds:var(--${d.c}s)" data-go="${d.n}"><small>Día ${d.n}</small><span class="t">${d.t}${d.sub?" ("+d.sub.split(" · ")[0].toLowerCase()+")":""}</span><span class="sc" id="tsc${d.n}">0 %</span></button>`);
  const body=[day1,day2,day3,day4,day5][d.n-1]();
  days.insertAdjacentHTML("beforeend",`<section class="day" id="day${d.n}" role="tabpanel" hidden style="--dc:var(--${d.c});--ds:var(--${d.c}s)">${intro(d)}${body}${footer(d.n)}</section>`);
});

// restaurar valores
$$("[data-k]").forEach(el=>{const v=store[el.dataset.k]; if(v==null)return;
  if(el.type==="radio") el.checked=(el.value===v); else if(el.tagName==="SELECT") el.value=v; else el.value=el.classList.contains("num")&&parse(v)!=null?fmt(parse(v)):v;});

// ---------- revisión ----------
const mark=(el,s)=>{if(!el)return;el.classList.remove("ok","err");if(s)el.classList.add(s)};
const icon=(el,s)=>{mark(el,s);el.textContent=s==="ok"?"✔":s==="err"?"✘":""};
// e: valor esperado (0 = vacío o cero). Devuelve [estado, correcto]
function chk(id,e){const el=$("#"+id),v=parse(el.value);let s="",c;
  if(e>0){c=v===e; s=v===null?"":(c?"ok":"err")} else {c=(v===null||v===0); s=v===null?"":(v===0?"ok":"err")}
  mark(el,s); return [s,c,v];}
const rowState=(states,allOk,anyFilled)=>allOk?"ok":(states.includes("err")?"err":(anyFilled&&false?"err":""));

const sc={};
function check(){
  // Día 1
  let ok1=0,tot1=0;
  OPS.forEach((o,i)=>{let sd=0,scr=0; const used={};
    o.l.forEach((_,j)=>{const k=`d1-${i}-${j}`;tot1++;
      const sel=$(`#${k}-c`),code=sel.value,dEl=$(`#${k}-d`),cEl=$(`#${k}-cr`);
      const dv=parse(dEl.value),cv=parse(cEl.value); sd+=dv||0; scr+=cv||0;
      $(`#${k}-n`).textContent=code?CAT[code]:"";
      const sol=o.l.find(l=>String(l[0])===code); used[code]=(used[code]||0)+1;
      let codeOk=!!sol&&used[code]===1;
      mark(sel,code?(codeOk?"ok":"err"):"");
      let st="",good=false;
      if(codeOk){const a=chk(`${k}-d`,sol[1]),b=chk(`${k}-cr`,sol[2]);
        good=a[1]&&b[1]&&(a[2]!==null||b[2]!==null);
        st=good?"ok":(a[0]==="err"||b[0]==="err"?"err":"");}
      else {mark(dEl,"");mark(cEl,""); st=code?"err":"";}
      icon($(`#${k}-i`),st); if(good)ok1++;});
    $(`#d1-${i}-sd`).textContent=fmt(sd); $(`#d1-${i}-sc`).textContent=fmt(scr);
    const m=$(`#d1-${i}-m`); if(!sd&&!scr){mark(m,"");m.textContent=""} else if(sd===scr){mark(m,"ok");m.textContent="✔ Sumas iguales"} else {mark(m,"err");m.textContent="✘ Las sumas no cuadran"}
  });
  sc[1]=[ok1,tot1];
  // Día 2
  let ok2=0,tot2=0;
  AUX.forEach((a,i)=>a.r.forEach((r,j)=>{const k=`d2-${i}-${j}`;tot2++;
    const x=[chk(k+"-d",r[2]),chk(k+"-cr",r[3]),chk(k+"-s",r[4])];
    const good=x.every(z=>z[1]); if(good)ok2++;
    icon($(`#${k}-i`),good?"ok":(x.some(z=>z[0]==="err")?"err":""));}));
  sc[2]=[ok2,tot2];
  // Día 3
  let ok3=0;
  MAY.forEach((m,i)=>{const k=`d3-${i}`;
    const x=[chk(k+"-d",m[1]),chk(k+"-cr",m[2]),chk(k+"-s",m[3])];
    const nt=$(`#${k}-nt`); const ntOk=nt.value===m[4]; mark(nt,nt.value?(ntOk?"ok":"err"):"");
    const good=x.every(z=>z[1])&&ntOk; if(good)ok3++;
    icon($(`#${k}-i`),good?"ok":(x.some(z=>z[0]==="err")||(nt.value&&!ntOk)?"err":""));});
  sc[3]=[ok3,MAY.length];
  // Día 4
  let ok4=0,sumD=0,sumC=0;
  MAY.forEach((m,i)=>{const k=`d4-${i}`;const deu=m[4]==="Deudor";
    const a=chk(k+"-d",deu?m[3]:0),b=chk(k+"-cr",deu?0:m[3]); sumD+=a[2]||0; sumC+=b[2]||0;
    const good=a[1]&&b[1]; if(good)ok4++;
    icon($(`#${k}-i`),good?"ok":(a[0]==="err"||b[0]==="err"?"err":""));});
  const t1=chk("d4-td",TOTDEU),t2=chk("d4-tc",TOTDEU);
  const tg=t1[1]&&t2[1]; if(t1[1])ok4++; if(t2[1])ok4++;
  icon($("#d4-ti"),tg?"ok":(t1[0]==="err"||t2[0]==="err"?"err":""));
  const m4=$("#d4-m"); if(t1[2]!=null&&t2[2]!=null){const eq=t1[2]===t2[2];mark(m4,eq?"ok":"err");m4.textContent=eq?"✔ Cuadra":"✘ No cuadra"} else {mark(m4,"");m4.textContent=""}
  sc[4]=[ok4,MAY.length+2];
  // Día 5
  let ok5=0,tot5=0;
  INV.forEach((v,i)=>{tot5++;const a=chk(`d5-i${i}`,v[1]*v[2]); if(a[1])ok5++; icon($(`#d5-i${i}-i`),a[0])});
  tot5++; {const a=chk("d5-it",INV.reduce((x,v)=>x+v[1]*v[2],0)); if(a[1])ok5++; icon($("#d5-it-i"),a[0])}
  MAY.forEach((m,i)=>{tot5++;const s=$(`#d5-c${i}`),g=s.value===CLASE[m[0]]; mark(s,s.value?(g?"ok":"err"):""); icon($(`#d5-c${i}-i`),s.value?(g?"ok":"err"):""); if(g)ok5++});
  TOT.forEach((t,i)=>{tot5++;const a=chk(`d5-t${i}`,t[1]); if(a[1])ok5++; icon($(`#d5-t${i}-i`),a[0])});
  let okE=0;
  EVAL.forEach((q,i)=>{q.o.forEach((_,j)=>mark($(`#q${i}-${j}-l`),""));
    const r=$(`input[name="q${i}"]:checked`); const e=$(`#q${i}-e`);
    if(r){const j=+r.value,g=j===q.a; mark($(`#q${i}-${j}-l`),g?"ok":"err"); if(g)okE++; e.hidden=false} else e.hidden=true;});
  sc[5]=[ok5,tot5,okE,EVAL.length];

  // puntajes
  const pct={1:ok1/tot1,2:ok2/tot2,3:ok3/MAY.length,4:ok4/(MAY.length+2),5:0.5*ok5/tot5+0.5*okE/EVAL.length};
  $("#sc1").textContent=`${ok1} de ${tot1} líneas correctas`;
  $("#sc2").textContent=`${ok2} de ${tot2} líneas correctas`;
  $("#sc3").textContent=`${ok3} de ${MAY.length} cuentas correctas`;
  $("#sc4").textContent=`${ok4} de ${MAY.length+2} correctas`;
  $("#sc5").textContent=`actividad ${ok5} de ${tot5} · evaluación ${okE} de ${EVAL.length}`;
  let nota=0; for(let n=1;n<=5;n++){nota+=2*pct[n]; $("#tsc"+n).textContent=Math.round(pct[n]*100)+" %"}
  $("#nota").textContent=(Math.round(nota*10)/10).toLocaleString("es-CO",{minimumFractionDigits:1,maximumFractionDigits:1});
}

// ---------- eventos ----------
function show(n){curDay=n;if(typeof renderSheet==="function"&&!$("#sheet").hidden)renderSheet();DAYS.forEach(d=>{$("#day"+d.n).hidden=d.n!==n;$("#tab"+d.n).setAttribute("aria-selected",d.n===n)});
  try{localStorage.setItem("libros5dias-v2-tab",n)}catch(e){}}
document.addEventListener("input",e=>{const el=e.target;if(!el.dataset.k)return;
  store[el.dataset.k]=el.type==="radio"?el.value:el.value; save(); check();});
document.addEventListener("change",e=>{const el=e.target;if(!el.dataset.k)return;store[el.dataset.k]=el.value;save();check();});
document.addEventListener("focusout",e=>{const el=e.target;if(el.classList&&el.classList.contains("num")){const v=parse(el.value);if(v!=null)el.value=fmt(v)}});
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g){show(+g.dataset.go); window.scrollTo({top:0}); return;}
  const r=e.target.closest("[data-reset]"); if(r){const n=r.dataset.reset,box=$("#rb"+n);
    box.dataset.html=box.innerHTML;
    box.innerHTML=`<span class="confirm">¿Borrar todo lo del Día ${n}? <button class="btn pri" data-yes="${n}">Sí, borrar</button><button class="btn" data-no="${n}">Cancelar</button></span>`; return;}
  const y=e.target.closest("[data-yes]"); if(y){const n=y.dataset.yes;
    $$(`#day${n} [data-k]`).forEach(el=>{delete store[el.dataset.k]; if(el.type==="radio")el.checked=false; else el.value=""});
    save(); check(); const box=$("#rb"+n); box.innerHTML=box.dataset.html; return;}
  const no=e.target.closest("[data-no]"); if(no){const box=$("#rb"+no.dataset.no); box.innerHTML=box.dataset.html;}
});

// ---------- panel del ejercicio ----------
let curDay=1, sheetView="ej";
function renderSheet(){
  const sec=$("#day"+curDay); if(!sec)return;
  const d=DAYS[curDay-1];
  $("#sheet").style.setProperty("--dc","var(--"+d.c+")");
  $("#fab").style.setProperty("--dc","var(--"+d.c+")");
  $("#sheetDay").textContent="Día "+curDay+" · "+d.t;
  $$(".stab").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.sv===sheetView)));
  const boxes=[...sec.querySelectorAll(".box")];
  const src=sheetView==="ej"?boxes.find(b=>b.querySelector("h3")&&b.querySelector("h3").textContent.trim()==="El ejercicio"):sec.querySelector(".cols .box:nth-child(2)");
  const body=$("#sheetBody"); body.textContent="";
  if(src){const c=src.cloneNode(true); c.removeAttribute("id"); body.appendChild(c);}
}
function setSheet(open){
  $("#sheet").hidden=!open; $("#fab").hidden=open;
  $("#fab").setAttribute("aria-expanded",String(open));
  document.documentElement.classList.toggle("sheet-open",open);
  if(open)renderSheet();
}
$("#fab").addEventListener("click",()=>setSheet(true));
$("#sheetClose").addEventListener("click",()=>setSheet(false));
document.addEventListener("click",e=>{const b=e.target.closest("[data-sv]"); if(b){sheetView=b.dataset.sv;renderSheet();}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden)setSheet(false)});

let start=1; try{start=+localStorage.getItem("libros5dias-v2-tab")||1}catch(e){}
show(start>=1&&start<=5?start:1); check();

/* ---------- encabezado fijo ---------- */
(function(){const st=$("#stick");let mini=false;
  const upd=()=>{const y=scrollY;if(!mini&&y>90){mini=true;st.classList.add("mini")}else if(mini&&y<20){mini=false;st.classList.remove("mini")}};
  addEventListener("scroll",upd,{passive:true});upd();
  const pad=()=>{document.documentElement.style.scrollPaddingTop=(st.offsetHeight+12)+"px"};
  try{new ResizeObserver(pad).observe(st)}catch(e){addEventListener("resize",pad)}pad();
})();
const KEYP="libros5dias-v2-";
const fmtK=v=>Number(v).toLocaleString("es-CO",{maximumFractionDigits:2});
/* ---------- calculadora flotante ---------- */
(function(){const box=$("#calc"),T=$("#calcT"),Ei=$("#calcE"),R=$("#calcR");let last=null;
  const set=o=>{box.classList.toggle("open",o);T.setAttribute("aria-expanded",o);$("#calcI").textContent=o?"▼":"▲";try{localStorage.setItem(KEYP+"calc",o?"1":"0")}catch(e){}};
  try{set(localStorage.getItem(KEYP+"calc")==="1")}catch(e){}
  let moved=false;
  T.onclick=()=>{if(moved){moved=false;return}set(!box.classList.contains("open"));if(box.classList.contains("open"))Ei.focus()};
  /* arrastrar la calculadora desde su barra */
  const clamp=(x,y)=>{const w=box.offsetWidth,h=box.offsetHeight;return [Math.min(Math.max(0,x),innerWidth-w),Math.min(Math.max(0,y),innerHeight-h)]};
  const place=(x,y)=>{[x,y]=clamp(x,y);box.style.left=x+"px";box.style.top=y+"px";box.style.right="auto";box.style.bottom="auto"};
  try{const p=JSON.parse(localStorage.getItem(KEYP+"calcpos")||"null");if(p)place(p[0],p[1])}catch(e){}
  addEventListener("resize",()=>{if(box.style.left)place(parseFloat(box.style.left),parseFloat(box.style.top))});
  if(T.style){T.style.touchAction="none";T.style.cursor="grab"}
  T.addEventListener("pointerdown",e=>{const r=box.getBoundingClientRect(),dx=e.clientX-r.left,dy=e.clientY-r.top,sx=e.clientX,sy=e.clientY;moved=false;
    const mv=ev2=>{if(!moved&&Math.hypot(ev2.clientX-sx,ev2.clientY-sy)<5)return;moved=true;place(ev2.clientX-dx,ev2.clientY-dy)};
    const up=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up);if(moved){try{localStorage.setItem(KEYP+"calcpos",JSON.stringify([parseFloat(box.style.left),parseFloat(box.style.top)]))}catch(e){}setTimeout(()=>{moved=false},0)}};
    addEventListener("pointermove",mv);addEventListener("pointerup",up)});
  /* teclado: Alt+C abre y enfoca; Esc la minimiza */
  addEventListener("keydown",e=>{if(e.altKey&&(e.key==="c"||e.key==="C")){e.preventDefault();set(true);Ei.focus();Ei.select()}else if(e.key==="Escape"&&box.contains(document.activeElement)){set(false);document.activeElement.blur()}});
  const ev=s=>{s=String(s).replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/\s|\$/g,"");if(!s)return null;
    s=s.replace(/(\d)\.(?=\d{3}(\D|$))/g,"$1").replace(/,/g,".");if(!/^[0-9+\-*\/().]+$/.test(s))return NaN;
    try{const v=Function('"use strict";return ('+s+')')();return typeof v==="number"&&isFinite(v)?v:NaN}catch(e){return NaN}};
  const show=()=>{const v=ev(Ei.value);last=v;R.textContent=v===null?"":isNaN(v)?"Revisa la operación":"= "+fmtK(Math.round(v*100)/100).replace("$","")};
  Ei.oninput=show;Ei.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();const v=ev(Ei.value);if(v!==null&&!isNaN(v)){Ei.value=String(Math.round(v*100)/100).replace(".",",");show()}}};
  const keys=["7","8","9","÷","4","5","6","×","1","2","3","−","0",",","⌫","+","(",")","C","="];
  $("#calcK").innerHTML=keys.map(k=>`<button type="button" data-ck="${k}" class="${"÷×−+".includes(k)?"op":k==="="?"eq":""}">${k}</button>`).join("");
  $("#calcK").onclick=e=>{const k=e.target.dataset&&e.target.dataset.ck;if(!k)return;
    if(k==="C")Ei.value="";else if(k==="⌫")Ei.value=Ei.value.slice(0,-1);
    else if(k==="="){const v=ev(Ei.value);if(v!==null&&!isNaN(v))Ei.value=String(Math.round(v*100)/100).replace(".",",")}
    else Ei.value+=k;show()};
  $("#calcCl").onclick=()=>{Ei.value="";show();Ei.focus()};
  $("#calcCp").onclick=()=>{if(last==null||isNaN(last))return;const t=String(Math.round(last*100)/100).replace(".",",");const done=()=>{$("#calcCp").textContent="¡Copiado!";setTimeout(()=>$("#calcCp").textContent="Copiar resultado",1200)};
    try{navigator.clipboard.writeText(t).then(done,()=>{Ei.value=t;Ei.select()})}catch(e){Ei.value=t;Ei.select()}};
})();


</script>
